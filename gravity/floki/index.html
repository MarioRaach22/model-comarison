<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Sandbox</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Crimson Pro', serif;
    }
    
    canvas {
      display: block;
      cursor: crosshair;
    }
    
    .overlay {
      position: fixed;
      bottom: 24px;
      left: 24px;
      color: rgba(224, 224, 224, 0.6);
      font-size: 13px;
      letter-spacing: 0.5px;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
      line-height: 1.8;
    }
    
    .stats {
      position: fixed;
      top: 24px;
      right: 24px;
      color: rgba(224, 224, 224, 0.5);
      font-size: 12px;
      letter-spacing: 1px;
      text-align: right;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="overlay">
    <span style="color: #00fff7;">click</span> add attractor<br>
    <span style="color: #00fff7;">right-click</span> remove nearest<br>
    <span style="color: #00fff7;">space</span> clear all
  </div>
  <div class="stats">
    <div id="particleCount">particles: 0</div>
    <div id="attractorCount">attractors: 0</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const particleCountEl = document.getElementById('particleCount');
    const attractorCountEl = document.getElementById('attractorCount');

    let width, height;
    const PARTICLE_COUNT = 400;
    const G = 0.4;
    const MAX_VELOCITY = 8;
    const MAX_ATTRACTORS = 10;
    const TRAIL_ALPHA = 0.12;
    const MIN_DISTANCE = 25;

    let particles = [];
    let attractors = [];
    let time = 0;

    const particleColors = [
      { r: 255, g: 107, b: 53 },
      { r: 247, g: 147, b: 30 },
      { r: 255, g: 215, b: 0 },
      { r: 255, g: 160, b: 80 },
      { r: 255, g: 130, b: 50 }
    ];

    class Particle {
      constructor(x, y) {
        this.x = x !== undefined ? x : Math.random() * width;
        this.y = y !== undefined ? y : Math.random() * height;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.radius = 1.5 + Math.random() * 1.5;
        this.trail = [];
        this.maxTrail = 25 + Math.random() * 15;
        this.color = particleColors[Math.floor(Math.random() * particleColors.length)];
      }

      update() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > this.maxTrail) {
          this.trail.shift();
        }

        let ax = 0, ay = 0;

        for (const attractor of attractors) {
          const dx = attractor.x - this.x;
          const dy = attractor.y - this.y;
          const distSq = dx * dx + dy * dy;
          const dist = Math.sqrt(distSq);

          if (dist > MIN_DISTANCE) {
            const force = (G * attractor.mass) / distSq;
            ax += (dx / dist) * force;
            ay += (dy / dist) * force;
          }
        }

        this.vx += ax;
        this.vy += ay;

        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        if (speed > MAX_VELOCITY) {
          this.vx = (this.vx / speed) * MAX_VELOCITY;
          this.vy = (this.vy / speed) * MAX_VELOCITY;
        }

        this.vx *= 0.999;
        this.vy *= 0.999;
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0) this.x = width;
        if (this.x > width) this.x = 0;
        if (this.y < 0) this.y = height;
        if (this.y > height) this.y = 0;
      }

      draw() {
        // Draw trail
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i];
          const alpha = (i / this.trail.length) * 0.4;
          const size = this.radius * (0.3 + (i / this.trail.length) * 0.7);
          
          ctx.beginPath();
          ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha})`;
          ctx.fill();
        }

        // Draw particle with glow
        const gradient = ctx.createRadialGradient(
          this.x, this.y, 0,
          this.x, this.y, this.radius * 3
        );
        gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 1)`);
        gradient.addColorStop(0.3, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.6)`);
        gradient.addColorStop(1, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0)`);

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 3, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, 0.9)`;
        ctx.fill();
      }
    }

    class Attractor {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.mass = 2000;
        this.radius = 12;
        this.pulsePhase = Math.random() * Math.PI * 2;
      }

      update() {
        this.pulsePhase += 0.05;
      }

      draw() {
        const pulse = 1 + Math.sin(this.pulsePhase) * 0.15;
        const r = this.radius * pulse;

        // Outer corona
        const coronaGradient = ctx.createRadialGradient(
          this.x, this.y, r * 0.5,
          this.x, this.y, r * 4
        );
        coronaGradient.addColorStop(0, 'rgba(0, 255, 247, 0.3)');
        coronaGradient.addColorStop(0.5, 'rgba(0, 255, 247, 0.1)');
        coronaGradient.addColorStop(1, 'rgba(0, 255, 247, 0)');

        ctx.beginPath();
        ctx.arc(this.x, this.y, r * 4, 0, Math.PI * 2);
        ctx.fillStyle = coronaGradient;
        ctx.fill();

        // Rotating rays
        for (let i = 0; i < 6; i++) {
          const angle = (i / 6) * Math.PI * 2 + time * 0.02;
          const rayLength = r * 2.5;
          
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(angle);
          
          const rayGradient = ctx.createLinearGradient(0, 0, rayLength, 0);
          rayGradient.addColorStop(0, 'rgba(0, 255, 247, 0.4)');
          rayGradient.addColorStop(1, 'rgba(0, 255, 247, 0)');
          
          ctx.beginPath();
          ctx.moveTo(r, 0);
          ctx.lineTo(rayLength, 0);
          ctx.strokeStyle = rayGradient;
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }

        // Main body
        const mainGradient = ctx.createRadialGradient(
          this.x, this.y, 0,
          this.x, this.y, r
        );
        mainGradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        mainGradient.addColorStop(0.3, 'rgba(0, 255, 247, 0.9)');
        mainGradient.addColorStop(0.7, 'rgba(0, 200, 200, 0.6)');
        mainGradient.addColorStop(1, 'rgba(0, 150, 150, 0.3)');

        ctx.beginPath();
        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
        ctx.fillStyle = mainGradient;
        ctx.fill();

        // Core
        ctx.beginPath();
        ctx.arc(this.x, this.y, r * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.fill();
      }
    }

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    function init() {
      resize();
      particles = [];
      attractors = [];

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
      }

      updateStats();
    }

    function updateStats() {
      particleCountEl.textContent = `particles: ${particles.length}`;
      attractorCountEl.textContent = `attractors: ${attractors.length}`;
    }

    function drawBackground() {
      // Gradient fade for trails
      ctx.fillStyle = `rgba(10, 10, 15, ${TRAIL_ALPHA})`;
      ctx.fillRect(0, 0, width, height);
    }

    function drawVignette() {
      const gradient = ctx.createRadialGradient(
        width / 2, height / 2, height * 0.3,
        width / 2, height / 2, Math.max(width, height) * 0.8
      );
      gradient.addColorStop(0, 'rgba(10, 10, 15, 0)');
      gradient.addColorStop(1, 'rgba(5, 5, 10, 0.6)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    }

    function update() {
      time++;

      for (const particle of particles) {
        particle.update();
      }

      for (const attractor of attractors) {
        attractor.update();
      }
    }

    function draw() {
      drawBackground();

      for (const particle of particles) {
        particle.draw();
      }

      for (const attractor of attractors) {
        attractor.draw();
      }

      drawVignette();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function addAttractor(x, y) {
      if (attractors.length >= MAX_ATTRACTORS) {
        attractors.shift();
      }
      attractors.push(new Attractor(x, y));
      updateStats();
    }

    function removeNearestAttractor(x, y) {
      if (attractors.length === 0) return;

      let nearestIdx = 0;
      let nearestDist = Infinity;

      for (let i = 0; i < attractors.length; i++) {
        const a = attractors[i];
        const dist = Math.sqrt((a.x - x) ** 2 + (a.y - y) ** 2);
        if (dist < nearestDist) {
          nearestDist = dist;
          nearestIdx = i;
        }
      }

      attractors.splice(nearestIdx, 1);
      updateStats();
    }

    function clearAttractors() {
      attractors = [];
      updateStats();
    }

    canvas.addEventListener('click', (e) => {
      addAttractor(e.clientX, e.clientY);
    });

    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      removeNearestAttractor(e.clientX, e.clientY);
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        clearAttractors();
      }
    });

    window.addEventListener('resize', resize);

    init();
    loop();
  </script>
</body>
</html>
