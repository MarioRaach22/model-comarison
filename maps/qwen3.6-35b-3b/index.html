<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Language Explorer</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    overflow: hidden;
    height: 100vh;
  }
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border-bottom: 1px solid #334155; padding: 12px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    backdrop-filter: blur(10px);
  }
  #header h1 {
    font-size: 1.3rem; font-weight: 700;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }
  #search-box { position: relative; flex-shrink: 0; }
  #search-box input {
    background: #1e293b; border: 1px solid #475569; border-radius: 8px;
    padding: 8px 14px 8px 36px; color: #e2e8f0; font-size: 0.9rem;
    width: 260px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #search-box input:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(96,165,250,0.15);
  }
  #search-box .icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: #64748b; font-size: 14px;
  }
  #search-results {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: #1e293b; border: 1px solid #475569; border-radius: 8px;
    max-height: 260px; overflow-y: auto; display: none; z-index: 200;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  #search-results .result-item {
    padding: 8px 14px; cursor: pointer;
    border-bottom: 1px solid #334155;
    transition: background 0.15s; font-size: 0.88rem;
  }
  #search-results .result-item:hover { background: #334155; }
  #search-results .result-item:last-child { border-bottom: none; }
  .header-btn {
    background: #1e293b; border: 1px solid #475569; color: #e2e8f0;
    border-radius: 8px; padding: 8px 14px; font-size: 0.88rem;
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .header-btn:hover { background: #334155; border-color: #60a5fa; }
  .header-btn.active { background: #1d4ed8; border-color: #60a5fa; }
  #controls-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  #map-container { width: 100%; height: 100vh; padding-top: 60px; }
  #map-svg { width: 100%; height: 100%; cursor: grab; }
  #map-svg:active { cursor: grabbing; }
  .country-path {
    stroke: #1e293b; stroke-width: 0.5px; cursor: pointer;
    transition: stroke 0.15s, stroke-width 0.15s;
  }
  .country-path:hover { stroke: #f8fafc; stroke-width: 1.5px; }
  .country-path.selected { stroke: #fbbf24; stroke-width: 2.5px; }
  .country-path.no-data { fill: #1e293b !important; }
  #tooltip {
    position: fixed; pointer-events: none;
    background: rgba(15, 23, 42, 0.95); border: 1px solid #475569;
    border-radius: 8px; padding: 8px 14px; font-size: 0.88rem; color: #f1f5f9;
    z-index: 300; display: none; backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 250px;
  }
  #tooltip .tt-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
  #info-panel {
    position: fixed; right: -420px; top: 60px; bottom: 0; width: 400px;
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    border-left: 1px solid #334155; z-index: 150;
    transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-y: auto;
    box-shadow: -5px 0 30px rgba(0,0,0,0.3);
  }
  #info-panel.open { right: 0; }
  #panel-close {
    position: absolute; top: 14px; right: 14px;
    background: #334155; border: none; color: #e2e8f0;
    width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  #panel-close:hover { background: #475569; }
  .panel-content { padding: 24px; }
  .panel-country-name {
    font-size: 1.5rem; font-weight: 700; margin-bottom: 4px;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .panel-subtitle {
    color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px;
    padding-bottom: 16px; border-bottom: 1px solid #334155;
  }
  .lang-section { margin-bottom: 20px; }
  .lang-section h3 {
    font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: #94a3b8; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .lang-section h3 .badge {
    font-size: 0.7rem; padding: 2px 8px; border-radius: 10px;
    text-transform: none; letter-spacing: 0;
  }
  .badge-official { background: #065f46; color: #6ee7b7; }
  .badge-widely { background: #78350f; color: #fcd34d; }
  .lang-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: #0f172a; border-radius: 8px;
    margin-bottom: 6px; border: 1px solid #1e293b;
  }
  .lang-name { font-weight: 500; }
  .lang-family {
    font-size: 0.8rem; padding: 3px 10px; border-radius: 12px;
    background: #1e3a5f; color: #93c5fd; font-weight: 500;
  }
  .no-data-text { text-align: center; padding: 40px 20px; color: #64748b; }
  .no-data-text .icon { font-size: 3rem; margin-bottom: 12px; }
  .no-data-text p { font-size: 0.95rem; }
  .no-data-text p.sub { font-size: 0.85rem; color: #475569; margin-top: 8px; }
  #legend {
    position: fixed; bottom: 20px; left: 20px;
    background: rgba(15, 23, 42, 0.95); border: 1px solid #334155;
    border-radius: 12px; padding: 16px 20px; z-index: 150;
    display: none; backdrop-filter: blur(10px); max-height: 70vh;
    overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #legend.visible { display: block; }
  #legend h3 {
    font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: #94a3b8; margin-bottom: 12px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 0; font-size: 0.88rem;
  }
  .legend-color {
    width: 18px; height: 18px; border-radius: 4px;
    flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1);
  }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #0f172a; z-index: 500;
    transition: opacity 0.5s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 48px; height: 48px; border: 4px solid #334155;
    border-top-color: #60a5fa; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: #94a3b8; font-size: 0.95rem; }
  .zoom-controls {
    position: fixed; bottom: 20px; right: 20px;
    display: flex; flex-direction: column; gap: 4px; z-index: 100;
  }
  .zoom-btn {
    width: 36px; height: 36px; background: rgba(30, 41, 59, 0.9);
    border: 1px solid #475569; color: #e2e8f0; border-radius: 8px;
    cursor: pointer; font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .zoom-btn:hover { background: #334155; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Loading world map…</p>
</div>

<div id="header">
  <h1>🌍 Language Explorer</h1>
  <div id="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="search-input" placeholder="Search countries…" autocomplete="off">
    <div id="search-results"></div>
  </div>
  <div id="controls-right">
    <button class="header-btn" id="toggle-color" title="Color by language family">
      🎨 Color Map
    </button>
    <button class="header-btn" id="reset-zoom" title="Reset view">
      🏠 Reset
    </button>
  </div>
</div>

<div id="map-container">
  <svg id="map-svg"></svg>
</div>

<div id="tooltip">
  <div class="tt-name"></div>
  <div class="tt-sub"></div>
</div>

<div id="info-panel">
  <button id="panel-close">✕</button>
  <div class="panel-content" id="panel-body"></div>
</div>

<div id="legend"></div>

<div class="zoom-controls">
  <button class="zoom-btn" id="zoom-in">+</button>
  <button class="zoom-btn" id="zoom-out">−</button>
</div>

// APP STATE
// ═══════════════════════════════════════════════════════════
let colorByFamily = false;
let selectedCountry = null;
let worldFeatures = [];
let countriesByName = {};

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
async function init() {
  const width = window.innerWidth;
  const height = window.innerHeight - 60;

  const svg = d3.select("#map-svg")
    .attr("viewBox", `0 0 ${width} ${height}`);

  const g = svg.append("g");

  const projection = d3.geoNaturalEarth1()
    .scale(width / 6.2)
    .translate([width / 2, height / 2]);

  const path = d3.geoPath().projection(projection);

  // Zoom
  const zoom = d3.zoom()
    .scaleExtent([1, 12])
    .on("zoom", (event) => {
      g.attr("transform", event.transform);
    });

  svg.call(zoom);

  // Zoom buttons
  d3.select("#zoom-in").on("click", () => {
    svg.transition().duration(400).call(zoom.scaleBy, 1.5);
  });
  d3.select("#zoom-out").on("click", () => {
    svg.transition().duration(400).call(zoom.scaleBy, 0.67);
  });
  d3.select("#reset-zoom").on("click", () => {
    svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity);
    deselectCountry();
  });

  function getCountryInfo(d) {
    const iso = d.id;
    let info = LANG_DATA[iso];
    if (!info) {
      // Try padded 3-digit, reverse, and numeric versions
      const numId = String(iso).padStart(3, '0');
      const revId = String(Number(iso));
      info = LANG_DATA[iso] || LANG_DATA[Number(iso)] || LANG_DATA[numId] || LANG_DATA[revId];
    }
    if (!info) return null;
    let primaryFamily = null;
    if (info.official && info.official.length > 0) {
      primaryFamily = info.official[0].family;
    }
    return { ...info, primaryFamily };
  }

  // Color scale helper
  function getCountryColor(d) {
    const info = getCountryInfo(d);
    if (!colorByFamily) return "#334155";
    if (!info || !info.primaryFamily) return "#1e293b";
    return FAMILY_COLORS[info.primaryFamily] || "#475569";
  }

  // Load TopoJSON
  const topoData = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
  const countries = topojson.feature(topoData, topoData.objects.countries);

  worldFeatures = countries.features;

  // Build name lookup
  worldFeatures.forEach(f => {
    const info = getCountryInfo(f);
    if (info) {
      countriesByName[info.name.toLowerCase()] = f;
    }
  });

  // Draw countries
  g.selectAll(".country-path")
    .data(worldFeatures)
    .enter()
    .append("path")
    .attr("class", "country-path")
    .attr("d", path)
    .attr("fill", d => {
      const info = getCountryInfo(d);
      if (!info) return "#1e293b";
      if (colorByFamily) {
        return FAMILY_COLORS[info.primaryFamily] || "#475569";
      }
      return "#334155";
    })
    .on("mouseenter", function(event, d) {
      const info = getCountryInfo(d);
      const tooltip = d3.select("#tooltip");
      if (info) {
        tooltip.select(".tt-name").text(info.name);
        tooltip.select(".tt-sub").text(info.primaryFamily || "");
      } else {
        tooltip.select(".tt-name").text("Unknown territory");
        tooltip.select(".tt-sub").text("");
      }
      tooltip.style("display", "block");
    })
    .on("mousemove", function(event) {
      d3.select("#tooltip")
        .style("left", (event.clientX + 14) + "px")
        .style("top", (event.clientY - 10) + "px");
    })
    .on("mouseleave", function() {
      d3.select("#tooltip").style("display", "none");
    })
    .on("click", function(event, d) {
      event.stopPropagation();
      selectCountry(d);
    });

  // Click background to deselect
  svg.on("click", () => deselectCountry());

  // ═══ Search ═══
  const searchInput = document.getElementById("search-input");
  const searchResults = document.getElementById("search-results");

  searchInput.addEventListener("input", function() {
    const q = this.value.trim().toLowerCase();
    if (q.length < 1) {
      searchResults.style.display = "none";
      return;
    }
    const matches = worldFeatures
      .map(f => {
        const info = getCountryInfo(f);
        return info ? { name: info.name, feature: f } : null;
      })
      .filter(Boolean)
      .filter(f => f.name.toLowerCase().includes(q))
      .slice(0, 10);

    if (matches.length === 0) {
      searchResults.style.display = "none";
      return;
    }

    searchResults.innerHTML = matches.map(m =>
      `<div class="result-item" data-id="${m.feature.id}">${m.name}</div>`
    ).join("");

    searchResults.style.display = "block";

    searchResults.querySelectorAll(".result-item").forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        const feature = worldFeatures.find(f => f.id == id);
        if (feature) {
          zoomToFeature(feature);
          selectCountry(feature);
        }
        searchResults.style.display = "none";
        searchInput.value = "";
      });
    });
  });

  searchInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      const q = this.value.trim().toLowerCase();
      const match = Object.entries(countriesByName).find(([k]) => k === q);
      if (match) {
        zoomToFeature(match[1]);
        selectCountry(match[1]);
      }
      searchResults.style.display = "none";
    }
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest("#search-box")) {
      searchResults.style.display = "none";
    }
  });

  // ═══ Color toggle ═══
  d3.select("#toggle-color").on("click", function() {
    colorByFamily = !colorByFamily;
    d3.select(this).classed("active", colorByFamily);

    g.selectAll(".country-path")
      .transition().duration(400)
      .attr("fill", d => {
        const info = getCountryInfo(d);
        if (!info) return "#1e293b";
        if (colorByFamily) {
          return FAMILY_COLORS[info.primaryFamily] || "#475569";
        }
        return "#334155";
      });

    updateLegend();
  });

  // ═══ Panel ═══
  d3.select("#panel-close").on("click", () => {
    document.getElementById("info-panel").classList.remove("open");
    deselectCountry();
  });

  updateLegend();

  // Hide loading
  setTimeout(() => {
    document.getElementById("loading").classList.add("hidden");
  }, 300);
}

function selectCountry(d) {
  deselectCountry();
  selectedCountry = d;

  const info = getCountryInfo(d);
  const panel = document.getElementById("info-panel");
  const body = document.getElementById("panel-body");

  // Highlight the clicked path
  d3.selectAll(".country-path.selected").attr("class", "country-path");
  d3.selectAll(".country-path").filter(function() {
    return this.__data__ === d;
  }).attr("class", "country-path selected");

  if (!info) {
    body.innerHTML = `
      <div class="no-data-text">
        <div class="icon">🌍</div>
        <p>No language data available for this region.</p>
        <p class="sub">Try searching for another country in the search box above.</p>
      </div>`;
    panel.classList.add("open");
    return;
  }

  let html = `<div class="panel-country-name">${info.name}</div>`;

  if (info.primaryFamily) {
    html += `<div class="panel-subtitle">Dominant language family: <strong>${info.primaryFamily}</strong></div>`;
  } else {
    html += `<div class="panel-subtitle">No primary language family data</div>`;
  }

  // Official languages
  if (info.official && info.official.length > 0) {
    html += `<div class="lang-section"><h3>Official Languages <span class="badge badge-official">${info.official.length}</span></h3>`;
    info.official.forEach(l => {
      html += `<div class="lang-item"><span class="lang-name">${l.name}</span><span class="lang-family">${l.family}</span></div>`;
    });
    html += `</div>`;
  }

  // Widely spoken
  if (info.widely && info.widely.length > 0) {
    html += `<div class="lang-section"><h3>Widely Spoken <span class="badge badge-widely">${info.widely.length}</span></h3>`;
    info.widely.forEach(l => {
      html += `<div class="lang-item"><span class="lang-name">${l.name}</span><span class="lang-family">${l.family}</span></div>`;
    });
    html += `</div>`;
  }

  body.innerHTML = html;
  panel.classList.add("open");
}

function deselectCountry() {
  selectedCountry = null;
  d3.selectAll(".country-path").attr("class", "country-path");
}

function zoomToFeature(feature) {
  const width = window.innerWidth;
  const height = window.innerHeight - 60;

  const bounds = path.bounds(feature);
  const dx = bounds[1][0] - bounds[0][0];
  const dy = bounds[1][1] - bounds[0][1];

  const scale = Math.min(width / dx, height / dy) * 0.75;
  const translate = [
    width / 2 - scale * (bounds[0][0] + bounds[1][0]) / 2,
    height / 2 - scale * (bounds[0][1] + bounds[1][1]) / 2
  ];

  svg = document.getElementById("map-svg");
  d3.select(svg)
    .transition()
    .duration(750)
    .call(
      d3.zoom().transform,
      d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
    );
}

function getCountryInfo(d) {
  const iso = d.id;
  let info = LANG_DATA[iso];
  if (!info) {
    const numId = String(iso).padStart(3, '0');
    const revId = String(Number(iso));
    info = LANG_DATA[iso] || LANG_DATA[Number(iso)] || LANG_DATA[numId] || LANG_DATA[revId];
  }
  if (!info) return null;
  let primaryFamily = null;
  if (info.official && info.official.length > 0) {
    primaryFamily = info.official[0].family;
  }
  return { ...info, primaryFamily };
}

function updateLegend() {
  const legend = document.getElementById("legend");
  if (!colorByFamily) {
    legend.classList.remove("visible");
    return;
  }
  legend.classList.add("visible");

  const families = Object.entries(FAMILY_COLORS)
    .filter(([fam]) => {
      return worldFeatures.some(f => {
        const info = getCountryInfo(f);
        return info && info.primaryFamily === fam;
      });
    })
    .sort((a, b) => a[0].localeCompare(b[0]));

  let html = `<h3>Language Families</h3>`;
  families.forEach(([fam, color]) => {
    html += `<div class="legend-item"><div class="legend-color" style="background:${color}"></div><span>${fam}</span></div>`;
  });

  html += `<div class="legend-item" style="margin-top:8px;padding-top:8px;border-top:1px solid #334155;">
    <div class="legend-color" style="background:#1e293b"></div><span>No data</span></div>`;

  legend.innerHTML = html;
}

// Handle resize
window.addEventListener("resize", () => { location.reload(); });

init();
