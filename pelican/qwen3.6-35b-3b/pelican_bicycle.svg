<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Sky background -->
  <rect width="500" height="400" fill="#87CEEB"/>

  <!-- Ground / Road -->
  <rect x="0" y="320" width="500" height="80" fill="#4a4a4a"/>
  <line x1="0" y1="350" x2="500" y2="350" stroke="#ffffff" stroke-width="3" stroke-dasharray="30,20"/>

  <!-- Green grass at top of ground -->
  <rect x="0" y="310" width="500" height="15" fill="#4CAF50"/>

  <!-- Sun -->
  <circle cx="430" cy="60" r="35" fill="#FFD700"/>
  <line x1="430" y1="15" x2="430" y2="0" stroke="#FFD700" stroke-width="4"/>
  <line x1="430" y1="105" x2="430" y2="120" stroke="#FFD700" stroke-width="4"/>
  <line x1="385" y1="60" x2="370" y2="60" stroke="#FFD700" stroke-width="4"/>
  <line x1="475" y1="60" x2="490" y2="60" stroke="#FFD700" stroke-width="4"/>
  <line x1="398" y1="28" x2="388" y2="18" stroke="#FFD700" stroke-width="4"/>
  <line x1="462" y1="28" x2="472" y2="18" stroke="#FFD700" stroke-width="4"/>
  <line x1="398" y1="92" x2="388" y2="102" stroke="#FFD700" stroke-width="4"/>
  <line x1="462" y1="92" x2="472" y2="102" stroke="#FFD700" stroke-width="4"/>

  <!-- Clouds -->
  <ellipse cx="100" cy="50" rx="50" ry="20" fill="white" opacity="0.9"/>
  <ellipse cx="130" cy="45" rx="35" ry="18" fill="white" opacity="0.9"/>
  <ellipse cx="80" cy="48" rx="30" ry="15" fill="white" opacity="0.9"/>

  <ellipse cx="280" cy="35" rx="45" ry="18" fill="white" opacity="0.8"/>
  <ellipse cx="310" cy="30" rx="30" ry="15" fill="white" opacity="0.8"/>
  <ellipse cx="255" cy="33" rx="28" ry="14" fill="white" opacity="0.8"/>

  <!-- === BICYCLE === -->
  <!-- Back wheel -->
  <circle cx="150" cy="290" r="45" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="150" cy="290" r="3" fill="#333"/>
  <line x1="150" y1="245" x2="150" y2="335" stroke="#666" stroke-width="1.5"/>
  <line x1="105" y1="290" x2="195" y2="290" stroke="#666" stroke-width="1.5"/>
  <line x1="118" y1="258" x2="182" y2="322" stroke="#666" stroke-width="1.5"/>
  <line x1="182" y1="258" x2="118" y2="322" stroke="#666" stroke-width="1.5"/>

  <!-- Front wheel -->
  <circle cx="340" cy="290" r="45" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="340" cy="290" r="3" fill="#333"/>
  <line x1="340" y1="245" x2="340" y2="335" stroke="#666" stroke-width="1.5"/>
  <line x1="295" y1="290" x2="385" y2="290" stroke="#666" stroke-width="1.5"/>
  <line x1="308" y1="258" x2="372" y2="322" stroke="#666" stroke-width="1.5"/>
  <line x1="372" y1="258" x2="308" y2="322" stroke="#666" stroke-width="1.5"/>

  <!-- Bike frame -->
  <line x1="150" y1="290" x2="250" y2="200" stroke="#E74C3C" stroke-width="5" stroke-linecap="round"/>
  <line x1="250" y1="200" x2="310" y2="200" stroke="#E74C3C" stroke-width="5" stroke-linecap="round"/>
  <line x1="150" y1="290" x2="310" y2="200" stroke="#E74C3C" stroke-width="5" stroke-linecap="round"/>
  <line x1="250" y1="200" x2="255" y2="290" stroke="#E74C3C" stroke-width="5" stroke-linecap="round"/>
  <line x1="310" y1="200" x2="340" y2="290" stroke="#E74C3C" stroke-width="5" stroke-linecap="round"/>

  <!-- Seat post & seat -->
  <line x1="250" y1="200" x2="245" y2="185" stroke="#333" stroke-width="4"/>
  <ellipse cx="240" cy="182" rx="25" ry="8" fill="#333"/>

  <!-- Handlebar post & handlebar -->
  <line x1="310" y1="200" x2="320" y2="180" stroke="#333" stroke-width="4"/>
  <line x1="305" y1="175" x2="335" y2="175" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <!-- Handlebar grips -->
  <line x1="300" y1="173" x2="310" y2="173" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <line x1="330" y1="173" x2="340" y2="173" stroke="#333" stroke-width="8" stroke-linecap="round"/>

  <!-- Pedal & crank -->
  <circle cx="255" cy="290" r="10" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="255" y1="290" x2="240" y2="305" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <line x1="255" y1="290" x2="270" y2="275" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <!-- Pedals -->
  <rect x="230" y="302" width="20" height="6" rx="3" fill="#333"/>
  <rect x="260" y="272" width="20" height="6" rx="3" fill="#333"/>

  <!-- === PELICAN === -->
  <!-- Body -->
  <ellipse cx="235" cy="170" rx="40" ry="35" fill="#F5F5DC"/>

  <!-- Wing (left - visible) -->
  <ellipse cx="225" cy="165" rx="30" ry="20" fill="#E8E0C8" transform="rotate(-20 225 165)"/>
  <path d="M200 155 Q215 140 235 145" fill="none" stroke="#D4C9A8" stroke-width="2"/>
  <path d="M205 165 Q215 150 235 155" fill="none" stroke="#D4C9A8" stroke-width="2"/>

  <!-- Right wing -->
  <ellipse cx="245" cy="170" rx="25" ry="18" fill="#E8E0C8" transform="rotate(-10 245 170)"/>

  <!-- Neck -->
  <path d="M260 155 Q275 135 285 120" fill="none" stroke="#F5F5DC" stroke-width="22" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="290" cy="115" rx="20" ry="22" fill="#F5F5DC"/>

  <!-- Beak (big pelican beak!) -->
  <path d="M308 108 L365 115 L308 122" fill="#F4A460" stroke="#DEB887" stroke-width="1"/>
  <!-- Beak pouch -->
  <path d="M308 122 Q330 145 355 120" fill="#F4A460" stroke="#DEB887" stroke-width="1"/>

  <!-- Eye -->
  <circle cx="295" cy="108" r="4" fill="white"/>
  <circle cx="296" cy="108" r="2.5" fill="#222"/>
  <circle cx="297" cy="107" r="1" fill="white"/>

  <!-- Ear tuft -->
  <path d="M275 100 Q270 90 278 88 Q275 95 280 102" fill="#E8E0C8"/>
  <path d="M280 98 Q278 87 285 86 Q282 93 284 100" fill="#E8E0C8"/>

  <!-- Legs -->
  <!-- Left leg (on pedal) -->
  <line x1="240" y1="195" x2="235" y2="220" stroke="#F4A460" stroke-width="5" stroke-linecap="round"/>
  <line x1="235" y1="220" x2="240" y2="240" stroke="#F4A460" stroke-width="4" stroke-linecap="round"/>
  <!-- Foot -->
  <line x1="232" y1="242" x2="248" y2="242" stroke="#F4A460" stroke-width="4" stroke-linecap="round"/>

  <!-- Tail -->
  <path d="M195 175 Q180 170 175 160 Q185 165 195 172" fill="#E8E0C8"/>
  <path d="M190 180 Q175 178 168 168 Q180 173 190 177" fill="#D4C9A8"/>

  <!-- === SPEED LINES === -->
  <line x1="80" y1="200" x2="50" y2="200" stroke="#333" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="70" y1="220" x2="35" y2="220" stroke="#333" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="85" y1="240" x2="55" y2="240" stroke="#333" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- === BIRD in sky === -->
  <path d="M400 120 Q405 115 410 120" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M420 100 Q425 95 430 100" fill="none" stroke="#333" stroke-width="2"/>

  <!-- === FLOWERS on ground === -->
  <line x1="50" y1="310" x2="50" y2="290" stroke="#2E7D32" stroke-width="2"/>
  <circle cx="50" cy="287" r="5" fill="#FF69B4"/>
  <circle cx="50" cy="287" r="2" fill="#FFD700"/>

  <line x1="70" y1="310" x2="70" y2="295" stroke="#2E7D32" stroke-width="2"/>
  <circle cx="70" cy="292" r="4" fill="#FF6347"/>
  <circle cx="70" cy="292" r="1.5" fill="#FFD700"/>

  <line x1="440" y1="310" x2="440" y2="288" stroke="#2E7D32" stroke-width="2"/>
  <circle cx="440" cy="285" r="6" fill="#DA70D6"/>
  <circle cx="440" cy="285" r="2" fill="#FFD700"/>

  <line x1="460" y1="310" x2="460" y2="295" stroke="#2E7D32" stroke-width="2"/>
  <circle cx="460" cy="292" r="4" fill="#FF69B4"/>
  <circle cx="460" cy="292" r="1.5" fill="#FFD700"/>
</svg>
