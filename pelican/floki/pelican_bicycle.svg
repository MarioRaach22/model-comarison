<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Sky background -->
  <rect width="400" height="300" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect x="0" y="240" width="400" height="60" fill="#90EE90"/>
  
  <!-- Bicycle frame -->
  <g stroke="#333" stroke-width="4" fill="none">
    <!-- Wheels -->
    <circle cx="120" cy="220" r="40" stroke-width="4"/>
    <circle cx="280" cy="220" r="40" stroke-width="4"/>
    <!-- Wheel spokes -->
    <g stroke-width="1.5">
      <line x1="120" y1="180" x2="120" y2="260"/>
      <line x1="80" y1="220" x2="160" y2="220"/>
      <line x1="93" y1="193" x2="147" y2="247"/>
      <line x1="147" y1="193" x2="93" y2="247"/>
    </g>
    <g stroke-width="1.5">
      <line x1="280" y1="180" x2="280" y2="260"/>
      <line x1="240" y1="220" x2="320" y2="220"/>
      <line x1="253" y1="193" x2="307" y2="247"/>
      <line x1="307" y1="193" x2="253" y2="247"/>
    </g>
    <!-- Frame triangles -->
    <polygon points="120,220 200,160 120,160" fill="none"/>
    <polygon points="200,160 280,220 120,220" fill="none"/>
    <!-- Seat post -->
    <line x1="200" y1="160" x2="200" y2="140"/>
    <!-- Handlebars -->
    <line x1="260" y1="140" x2="280" y2="140"/>
    <line x1="280" y1="140" x2="280" y2="120"/>
    <line x1="265" y1="120" x2="295" y2="120"/>
  </g>
  
  <!-- Bicycle seat -->
  <ellipse cx="200" cy="138" rx="15" ry="5" fill="#8B4513"/>
  
  <!-- Pelican body -->
  <ellipse cx="180" cy="115" rx="35" ry="25" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/>
  
  <!-- Pelican neck -->
  <path d="M155,105 Q130,80 135,50" stroke="#FFFFFF" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M155,105 Q130,80 135,50" stroke="#E8E8E8" stroke-width="1" fill="none"/>
  
  <!-- Pelican head -->
  <ellipse cx="135" cy="45" rx="18" ry="14" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/>
  
  <!-- Pelican beak - upper -->
  <path d="M120,42 Q100,38 70,42 Q65,45 70,48 Q100,46 120,50" fill="#FFA500" stroke="#E07000" stroke-width="1"/>
  <!-- Pelican beak - pouch -->
  <path d="M120,50 Q100,50 85,50 Q80,58 90,65 Q105,60 120,55" fill="#FFB84D" stroke="#E07000" stroke-width="1"/>
  
  <!-- Pelican eye -->
  <circle cx="145" cy="40" r="4" fill="#333"/>
  <circle cx="146" cy="39" r="1.5" fill="#FFF"/>
  
  <!-- Pelican wing -->
  <path d="M160,100 Q180,85 210,95 Q220,110 200,120 Q175,125 160,115" fill="#F5F5F5" stroke="#D0D0D0" stroke-width="1"/>
  
  <!-- Pelican tail -->
  <path d="M210,115 Q235,110 240,125 Q230,130 215,125" fill="#F5F5F5" stroke="#D0D0D0" stroke-width="1"/>
  
  <!-- Pelican legs on pedals -->
  <g fill="none" stroke="#FF8C00" stroke-width="4" stroke-linecap="round">
    <!-- Left leg -->
    <path d="M170,130 Q160,160 155,175"/>
    <!-- Right leg -->
    <path d="M190,130 Q210,155 225,175"/>
  </g>
  
  <!-- Pelican feet on pedals -->
  <g fill="#FF8C00">
    <ellipse cx="155" cy="177" rx="8" ry="4"/>
    <ellipse cx="225" cy="177" rx="8" ry="4"/>
  </g>
  
  <!-- Pelican wing/torso holding handlebars -->
  <path d="M150,115 Q140,125 145,135" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Motion lines -->
  <g stroke="#555" stroke-width="2" stroke-linecap="round">
    <line x1="50" y1="200" x2="80" y2="200"/>
    <line x1="45" y1="210" x2="75" y2="210"/>
    <line x1="50" y1="220" x2="80" y2="220"/>
  </g>
  
  <!-- Small cloud -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="320" cy="50" rx="25" ry="15"/>
    <ellipse cx="340" cy="45" rx="20" ry="12"/>
    <ellipse cx="300" cy="48" rx="18" ry="10"/>
  </g>
  
  <!-- Sun -->
  <circle cx="350" cy="40" r="25" fill="#FFD700"/>
</svg>