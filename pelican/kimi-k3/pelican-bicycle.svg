<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="500" height="420">
  <!-- Background -->
  <rect width="500" height="420" fill="#eaf6fb"/>
  <ellipse cx="250" cy="380" rx="230" ry="18" fill="#d4e9d4"/>
  <circle cx="430" cy="55" r="30" fill="#ffd94d"/>

  <!-- ==================== BICYCLE ==================== -->
  <!-- Back wheel -->
  <circle cx="150" cy="330" r="55" fill="none" stroke="#333" stroke-width="7"/>
  <circle cx="150" cy="330" r="48" fill="none" stroke="#999" stroke-width="2"/>
  <g stroke="#777" stroke-width="2">
    <line x1="150" y1="330" x2="150" y2="278"/>
    <line x1="150" y1="330" x2="195" y2="304"/>
    <line x1="150" y1="330" x2="195" y2="356"/>
    <line x1="150" y1="330" x2="150" y2="382"/>
    <line x1="150" y1="330" x2="105" y2="356"/>
    <line x1="150" y1="330" x2="105" y2="304"/>
  </g>
  <circle cx="150" cy="330" r="7" fill="#444"/>

  <!-- Front wheel -->
  <circle cx="360" cy="330" r="55" fill="none" stroke="#333" stroke-width="7"/>
  <circle cx="360" cy="330" r="48" fill="none" stroke="#999" stroke-width="2"/>
  <g stroke="#777" stroke-width="2">
    <line x1="360" y1="330" x2="360" y2="278"/>
    <line x1="360" y1="330" x2="405" y2="304"/>
    <line x1="360" y1="330" x2="405" y2="356"/>
    <line x1="360" y1="330" x2="360" y2="382"/>
    <line x1="360" y1="330" x2="315" y2="356"/>
    <line x1="360" y1="330" x2="315" y2="304"/>
  </g>
  <circle cx="360" cy="330" r="7" fill="#444"/>

  <!-- Frame -->
  <g stroke="#c0392b" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="150" y1="330" x2="255" y2="330"/>   <!-- chainstay -->
    <line x1="150" y1="330" x2="230" y2="225"/>   <!-- seat tube-ish -->
    <line x1="230" y1="225" x2="335" y2="235"/>   <!-- top tube -->
    <line x1="255" y1="330" x2="335" y2="235"/>   <!-- down tube -->
    <line x1="335" y1="235" x2="360" y2="330"/>   <!-- fork -->
  </g>
  <!-- Handlebar -->
  <line x1="335" y1="235" x2="345" y2="205" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
  <path d="M345 205 q18 -6 26 6" stroke="#333" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Saddle -->
  <path d="M212 222 q18 -10 40 0 l-4 8 q-16 -6 -32 0 z" fill="#5a3a22"/>

  <!-- Crank & pedals -->
  <circle cx="255" cy="330" r="16" fill="none" stroke="#444" stroke-width="4"/>
  <line x1="255" y1="330" x2="275" y2="312" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <line x1="255" y1="330" x2="235" y2="348" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <rect x="268" y="304" width="18" height="7" rx="3" fill="#222"/>
  <rect x="222" y="345" width="18" height="7" rx="3" fill="#222"/>

  <!-- ==================== PELICAN ==================== -->
  <!-- Back leg (to rear pedal) -->
  <path d="M225 260 q-10 40 12 86" stroke="#f39c12" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M231 346 l14 4" stroke="#f39c12" stroke-width="9" stroke-linecap="round"/>
  <!-- Front leg (to front pedal) -->
  <path d="M250 262 q25 20 26 46" stroke="#f5a623" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M272 306 l14 2" stroke="#f5a623" stroke-width="9" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="235" cy="215" rx="62" ry="52" fill="#fdfdf8" stroke="#e0dcd0" stroke-width="2"/>
  <!-- Wing -->
  <path d="M200 190 q70 -25 95 25 q-20 45 -70 38 q-35 -8 -25 -63 z" fill="#e9e6da" stroke="#cfcaba" stroke-width="2"/>
  <path d="M215 205 q45 -12 65 18" stroke="#cfcaba" stroke-width="3" fill="none"/>
  <path d="M222 222 q38 -8 55 14" stroke="#cfcaba" stroke-width="3" fill="none"/>
  <!-- Tail -->
  <path d="M178 225 q-28 8 -36 26 q22 4 42 -6 z" fill="#e9e6da" stroke="#cfcaba" stroke-width="2"/>

  <!-- Neck -->
  <path d="M275 185 q25 -15 30 -55" stroke="#fdfdf8" stroke-width="34" fill="none" stroke-linecap="round"/>
  <path d="M275 185 q25 -15 30 -55" stroke="#e0dcd0" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.25"/>

  <!-- Head -->
  <circle cx="312" cy="118" r="27" fill="#fdfdf8" stroke="#e0dcd0" stroke-width="2"/>
  <!-- Eye -->
  <circle cx="321" cy="110" r="5.5" fill="#222"/>
  <circle cx="323" cy="108" r="1.8" fill="#fff"/>
  <!-- Crest feathers -->
  <path d="M292 100 q-12 -14 -6 -26 q10 8 12 22 z" fill="#e9e6da"/>
  <!-- Beak (upper) -->
  <path d="M333 112 q70 2 92 20 q-60 8 -94 2 z" fill="#f5a623" stroke="#d98e12" stroke-width="2"/>
  <!-- Beak pouch (lower) -->
  <path d="M334 124 q48 34 84 12 q-8 26 -46 26 q-32 -2 -40 -32 z" fill="#f7b955" stroke="#d98e12" stroke-width="2"/>

  <!-- Wing-arm reaching handlebar -->
  <path d="M285 200 q35 -5 55 2" stroke="#fdfdf8" stroke-width="16" fill="none" stroke-linecap="round"/>
  <circle cx="346" cy="203" r="9" fill="#fdfdf8" stroke="#e0dcd0" stroke-width="2"/>

  <!-- Motion lines -->
  <g stroke="#9ec9dd" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="55" y1="200" x2="105" y2="200"/>
    <line x1="40" y1="235" x2="95" y2="235"/>
    <line x1="60" y1="270" x2="100" y2="270"/>
  </g>
</svg>
