<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe8ff"/>
      <stop offset="100%" stop-color="#f0f7ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6c2"/>
      <stop offset="100%" stop-color="#ffd86b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="600" height="500" fill="url(#sky)"/>
  <circle cx="500" cy="90" r="70" fill="url(#sun)"/>
  <circle cx="500" cy="90" r="34" fill="#ffe27a"/>

  <!-- Ground -->
  <ellipse cx="300" cy="455" rx="280" ry="22" fill="#bfe3a8" opacity="0.7"/>
  <line x1="40" y1="430" x2="560" y2="430" stroke="#9ccf87" stroke-width="3" stroke-dasharray="14 10"/>

  <!-- ===== BICYCLE ===== -->
  <!-- Back wheel -->
  <circle cx="190" cy="340" r="62" fill="none" stroke="#2b2b2b" stroke-width="6"/>
  <circle cx="190" cy="340" r="56" fill="none" stroke="#444" stroke-width="2"/>
  <g stroke="#777" stroke-width="1.5">
    <line x1="190" y1="284" x2="190" y2="396"/>
    <line x1="134" y1="340" x2="246" y2="340"/>
    <line x1="151" y1="301" x2="229" y2="379"/>
    <line x1="229" y1="301" x2="151" y2="379"/>
  </g>
  <circle cx="190" cy="340" r="7" fill="#d4a017"/>

  <!-- Front wheel -->
  <circle cx="420" cy="340" r="62" fill="none" stroke="#2b2b2b" stroke-width="6"/>
  <circle cx="420" cy="340" r="56" fill="none" stroke="#444" stroke-width="2"/>
  <g stroke="#777" stroke-width="1.5">
    <line x1="420" y1="284" x2="420" y2="396"/>
    <line x1="364" y1="340" x2="476" y2="340"/>
    <line x1="381" y1="301" x2="459" y2="379"/>
    <line x1="459" y1="301" x2="381" y2="379"/>
  </g>
  <circle cx="420" cy="340" r="7" fill="#d4a017"/>

  <!-- Frame -->
  <g stroke="#c0392b" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="190" y1="340" x2="300" y2="340"/>   <!-- chainstay -->
    <line x1="300" y1="340" x2="300" y2="235"/>   <!-- seat tube -->
    <line x1="300" y1="235" x2="410" y2="200"/>   <!-- top tube -->
    <line x1="410" y1="200" x2="420" y2="340"/>   <!-- down fork to front hub -->
    <line x1="300" y1="235" x2="300" y2="150"/>   <!-- seat post -->
    <line x1="410" y1="200" x2="455" y2="135"/>   <!-- handlebar stem -->
  </g>

  <!-- Chain -->
  <line x1="190" y1="340" x2="300" y2="340" stroke="#555" stroke-width="2" stroke-dasharray="3 2"/>

  <!-- Handlebars -->
  <path d="M440 130 q10 -10 20 0 q5 8 -5 14" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
  <line x1="455" y1="135" x2="470" y2="128" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>

  <!-- Seat -->
  <path d="M276 150 q24 -10 48 0 q-12 8 -48 0 z" fill="#2b2b2b"/>

  <!-- Pedals -->
  <line x1="300" y1="340" x2="318" y2="372" stroke="#555" stroke-width="4"/>
  <rect x="312" y="368" width="14" height="8" rx="2" fill="#333"/>
  <line x1="300" y1="340" x2="282" y2="308" stroke="#555" stroke-width="4"/>
  <rect x="276" y="304" width="14" height="8" rx="2" fill="#333"/>

  <!-- ===== PELICAN ===== -->
  <!-- Tail feathers -->
  <path d="M250 215 l-40 -6 l8 22 z" fill="#e8e8e8" stroke="#bbb" stroke-width="1.5"/>
  <path d="M248 222 l-36 4 l12 18 z" fill="#f2f2f2" stroke="#bbb" stroke-width="1.5"/>

  <!-- Body -->
  <ellipse cx="300" cy="200" rx="58" ry="42" fill="#fbfbfb" stroke="#c8c8c8" stroke-width="2"/>
  <ellipse cx="300" cy="212" rx="50" ry="26" fill="#f3f3f3" opacity="0.7"/>

  <!-- Wing (flapping) -->
  <path d="M300 175 q40 -20 70 -30 q-12 22 -28 30 q-18 6 -42 4 z" fill="#ffffff" stroke="#bbb" stroke-width="1.8"/>
  <path d="M318 168 q28 -12 50 -22 q-8 16 -20 22 z" fill="#eaeaea" opacity="0.8"/>

  <!-- Neck -->
  <path d="M345 178 q30 -8 38 -44 q6 -28 -12 -44 q-20 -12 -34 6 q-6 22 2 40 q4 24 -18 34 z"
        fill="#fbfbfb" stroke="#c8c8c8" stroke-width="2"/>

  <!-- Head -->
  <ellipse cx="378" cy="98" rx="26" ry="23" fill="#fbfbfb" stroke="#c8c8c8" stroke-width="2"/>

  <!-- Eye -->
  <circle cx="386" cy="92" r="5" fill="#fff"/>
  <circle cx="387" cy="93" r="3.2" fill="#1a1a1a"/>
  <circle cx="385.5" cy="91.5" r="1" fill="#fff"/>

  <!-- Beak upper -->
  <path d="M398 92 q40 -6 64 6 q-18 14 -44 12 q-16 -2 -20 -10 z" fill="#f5b740" stroke="#c98c1a" stroke-width="1.5"/>

  <!-- Pelican pouch / lower beak -->
  <path d="M400 100 q-14 8 -2 34 q16 26 48 16 q-22 -10 -28 -28 q-10 -16 -14 -26 z" fill="#f8ca5e" stroke="#d9a21a" stroke-width="1.5"/>
  <path d="M398 96 q44 4 66 6 q-26 16 -60 6 z" fill="#fce79a" opacity="0.7"/>

  <!-- Little fish peeking from pouch -->
  <path d="M430 118 q-10 -6 -16 2 q6 -2 10 2 q4 4 -2 8 q8 -2 8 -12 z" fill="#6fb7d8" stroke="#3f8db0" stroke-width="1"/>

  <!-- Legs to pedals -->
  <g stroke="#e0a32e" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M288 235 q-6 60 30 130"/>
    <path d="M312 235 q10 60 -6 150"/>
  </g>
  <!-- Webbed feet -->
  <path d="M318 365 q-6 8 -14 10 q10 4 18 -2 z" fill="#e0a32e" stroke="#b87a12" stroke-width="1"/>
  <path d="M306 385 q-6 8 -14 10 q10 4 18 -2 z" fill="#e0a32e" stroke="#b87a12" stroke-width="1"/>

  <!-- Arm/wing reaching handlebars -->
  <path d="M345 168 q60 6 110 -40" fill="none" stroke="#c8c8c8" stroke-width="4" stroke-linecap="round"/>

  <!-- Motion lines -->
  <g stroke="#7fb3ff" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="120" y1="200" x2="80" y2="200"/>
    <line x1="120" y1="240" x2="70" y2="240"/>
    <line x1="125" y1="280" x2="95" y2="280"/>
  </g>
</svg>