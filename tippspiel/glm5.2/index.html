<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 · Tippspiel</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0f1f;
    --card:rgba(255,255,255,.06);
    --card-border:rgba(255,255,255,.14);
    --text:#eaf2ff;
    --muted:#9fb3d1;
    --gold:#ffd54f;
    --r32:#4fc3f7; --r16:#66bb6a; --qf:#ffa726; --sf:#ab47bc; --final:#ffd54f;
  }
  html,body{height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 12% 12%, rgba(79,195,247,.20), transparent 42%),
      radial-gradient(circle at 88% 18%, rgba(102,187,106,.20), transparent 42%),
      radial-gradient(circle at 50% 92%, rgba(171,71,188,.22), transparent 46%),
      var(--bg);
    min-height:100vh;
    overflow-x:hidden;
  }
  /* ---------- Header ---------- */
  header{
    padding:16px 24px; display:flex; flex-wrap:wrap; align-items:center; gap:16px;
    justify-content:space-between; position:sticky; top:0; z-index:50;
    background:rgba(10,15,31,.78); backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .title{font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px;letter-spacing:.5px}
  .title .trophy{font-size:26px;filter:drop-shadow(0 0 10px rgba(255,213,79,.6))}
  .title .wc{background:linear-gradient(135deg,#4fc3f7,#ab47bc,#ffd54f);-webkit-background-clip:text;background-clip:text;color:transparent}
  .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .toggle{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:3px}
  .toggle button{padding:8px 14px;border:none;background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;transition:.15s}
  .toggle button.active{background:linear-gradient(135deg,#42a5f5,#1e88e5);color:#fff;box-shadow:0 4px 12px rgba(33,150,243,.4)}
  .toggle button:disabled{opacity:.4;cursor:not-allowed}
  .btn{padding:9px 16px;border-radius:11px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;font-weight:700;cursor:pointer;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:linear-gradient(135deg,#43a047,#66bb6a);border:none;box-shadow:0 4px 14px rgba(67,160,71,.4)}
  .btn.primary:hover{box-shadow:0 6px 20px rgba(67,160,71,.55)}
  .btn.danger{background:linear-gradient(135deg,#e53935,#ef5350);border:none;box-shadow:0 4px 14px rgba(229,57,53,.35)}
  .btn.danger:hover{box-shadow:0 6px 20px rgba(229,57,53,.5)}
  .points{display:flex;flex-direction:column;align-items:center;padding:6px 18px;border-radius:13px;background:linear-gradient(135deg,rgba(255,213,79,.20),rgba(255,152,0,.10));border:1px solid rgba(255,213,79,.35)}
  .points .num{font-size:26px;font-weight:900;color:var(--gold);line-height:1;text-shadow:0 0 14px rgba(255,213,79,.4)}
  .points .sub{font-size:10px;color:#ffe7a0;text-transform:uppercase;letter-spacing:.6px;margin-top:3px;white-space:nowrap}
  /* ---------- Instructions / banner ---------- */
  .instructions{padding:10px 24px 2px;color:var(--muted);font-size:13px;text-align:center}
  .instructions b{color:#ffe082}
  #champion-banner{margin:12px auto;max-width:560px;padding:14px 22px;border-radius:16px;background:linear-gradient(135deg,#ffd54f,#ffb300);color:#2a1c00;font-weight:900;font-size:18px;text-align:center;display:none;align-items:center;justify-content:center;gap:10px;box-shadow:0 0 36px rgba(255,213,79,.45)}
  #champion-banner.show{display:flex;animation:bannerPop .6s cubic-bezier(.2,1.4,.4,1)}
  #champion-banner .cf{font-size:26px}
  /* ---------- Bracket ---------- */
  #bracket-scroll{overflow-x:auto;padding:10px 8px 40px}
  #bracket-scroll::-webkit-scrollbar{height:10px}
  #bracket-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:6px}
  #bracket-content{width:1890px;margin:0 auto;position:relative}
  #round-labels{display:flex}
  #round-labels .lbl{width:210px;flex:0 0 210px;text-align:center;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding-bottom:10px}
  #cols{display:flex;height:800px;position:relative}
  .col{width:210px;flex:0 0 210px;display:flex;flex-direction:column;justify-content:space-around;align-items:center}
  #connectors{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
  .match{
    width:190px;height:74px;background:var(--card);border:1px solid var(--card-border);
    border-radius:12px;position:relative;display:flex;flex-direction:column;overflow:hidden;
    cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.28);
    transition:transform .15s,box-shadow .15s,border-color .15s;
  }
  .match:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.4);border-color:rgba(255,255,255,.32)}
  .match.round-R32{box-shadow:inset 0 3px 0 var(--r32),0 4px 14px rgba(0,0,0,.28)}
  .match.round-R16{box-shadow:inset 0 3px 0 var(--r16),0 4px 14px rgba(0,0,0,.28)}
  .match.round-QF{box-shadow:inset 0 3px 0 var(--qf),0 4px 14px rgba(0,0,0,.28)}
  .match.round-SF{box-shadow:inset 0 3px 0 var(--sf),0 4px 14px rgba(0,0,0,.28)}
  .match.round-Final{box-shadow:inset 0 3px 0 var(--final),0 4px 14px rgba(0,0,0,.28)}
  .match.champion{border-color:var(--gold)!important;box-shadow:inset 0 3px 0 var(--gold),0 0 0 2px rgba(255,213,79,.55),0 0 34px rgba(255,213,79,.45)!important;animation:champPulse 2.2s infinite}
  .team{display:flex;align-items:center;gap:7px;padding:0 9px;height:50%;position:relative}
  .team .flag{font-size:18px;width:22px;text-align:center;flex:0 0 auto;line-height:1}
  .team .tname{flex:1 1 auto;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .team .score{flex:0 0 auto;font-weight:800;font-size:15px;min-width:18px;text-align:center;color:var(--muted)}
  .team .pen{font-size:11px;flex:0 0 auto}
  .team.winner{background:linear-gradient(90deg,rgba(255,213,79,.20),transparent);animation:winPop .5s ease}
  .team.winner .tname{color:#ffe8a3;font-weight:800}
  .team.winner .score{color:var(--gold)}
  .team.winner .pen{color:var(--gold)}
  .team.loser{opacity:.5}
  .team.tbd .tname{color:var(--muted);font-style:italic;font-weight:500}
  .team.tbd .flag{opacity:.35}
  .team.advance.from-left{animation:advLeft .5s cubic-bezier(.2,.9,.3,1) both}
  .team.advance.from-right{animation:advRight .5s cubic-bezier(.2,.9,.3,1) both}
  .pts-badge{position:absolute;top:5px;right:5px;font-size:10px;font-weight:900;padding:2px 6px;border-radius:9px;display:none}
  .pts-badge.p3{background:var(--gold);color:#3a2a00;box-shadow:0 0 10px rgba(255,213,79,.6)}
  .pts-badge.p1{background:#cfd8dc;color:#263238}
  .pts-badge.p0{background:rgba(255,255,255,.12);color:#cfd8dc}
  /* ---------- Modal ---------- */
  #modal-overlay{position:fixed;inset:0;background:rgba(5,8,20,.62);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
  #modal-overlay.show{display:flex;animation:fadein .2s}
  #modal{width:min(460px,94vw);background:linear-gradient(160deg,#1a2342,#0e1530);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .28s cubic-bezier(.2,1.3,.4,1);max-height:92vh;overflow:auto}
  .m-title{font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .m-round{font-size:11px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.08);padding:3px 9px;border-radius:8px;text-transform:uppercase;letter-spacing:.5px}
  .mm-teams{display:flex;align-items:stretch;justify-content:space-between;gap:10px;margin:20px 0 6px}
  .mm-team{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 8px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);transition:.2s}
  .mm-team.win{background:rgba(255,213,79,.14);border-color:rgba(255,213,79,.4)}
  .mm-flag{font-size:42px;line-height:1}
  .mm-name{font-weight:800;font-size:14px;text-align:center}
  .mm-team.win .mm-name{color:var(--gold)}
  .mm-vs{display:flex;align-items:center;font-size:13px;color:var(--muted);font-weight:800}
  .mm-team input{width:60px;height:56px;font-size:26px;text-align:center;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff;font-weight:900}
  .mm-team input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,213,79,.28)}
  .mm-team .rscore{font-size:26px;font-weight:900;min-width:34px;text-align:center}
  .mm-team.win .rscore{color:var(--gold)}
  #pen-box{margin-top:14px;padding:13px;background:rgba(255,213,79,.10);border:1px dashed rgba(255,213,79,.45);border-radius:12px;text-align:center}
  #pen-box .pen-label{font-size:13px;font-weight:700;margin-bottom:9px;color:#ffe8a3}
  .pen-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .pen-btn{padding:7px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-weight:700;cursor:pointer;font-size:12px;transition:.15s}
  .pen-btn:hover{background:rgba(255,255,255,.14)}
  .pen-btn.sel{background:var(--gold);color:#2a1c00;border-color:var(--gold)}
  .mm-compare{margin-top:16px;background:rgba(255,255,255,.04);border-radius:12px;padding:14px;font-size:14px;border:1px solid rgba(255,255,255,.06)}
  .cmp-row{display:flex;justify-content:space-between;padding:5px 0;align-items:center}
  .cmp-row span:first-child{color:var(--muted);font-weight:600}
  .cmp-pts{font-weight:900}
  .cmp-pts.gold{color:var(--gold)}
  .cmp-pts.silver{color:#eceff1}
  .mm-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
  /* ---------- Toast ---------- */
  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a2342;color:#fff;padding:13px 22px;border-radius:12px;border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 28px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200;font-weight:600;font-size:14px}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ---------- Animations ---------- */
  @keyframes advLeft{from{opacity:0;transform:translateX(-22px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes advRight{from{opacity:0;transform:translateX(22px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes winPop{0%{box-shadow:inset 0 0 0 0 rgba(255,213,79,0)}30%{box-shadow:inset 0 0 16px 0 rgba(255,213,79,.55)}100%{box-shadow:inset 0 0 0 0 rgba(255,213,79,0)}}
  @keyframes champPulse{0%,100%{box-shadow:inset 0 3px 0 var(--gold),0 0 0 2px rgba(255,213,79,.55),0 0 30px rgba(255,213,79,.4)!important}50%{box-shadow:inset 0 3px 0 var(--gold),0 0 0 2px rgba(255,213,79,.8),0 0 48px rgba(255,213,79,.65)!important}}
  @keyframes bannerPop{from{opacity:0;transform:scale(.8) translateY(-10px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  @media (max-width:720px){
    .title{font-size:17px}.points .num{font-size:21px}
    .btn,.toggle button{padding:7px 11px;font-size:12px}
  }
</style>
</head>
<body>
  <header>
    <div class="title"><span class="trophy">🏆</span><span><span class="wc">World Cup 2026</span> · Tippspiel</span></div>
    <div class="controls">
      <div class="toggle">
        <button id="tog-pred" class="active">My Predictions</button>
        <button id="tog-act" disabled>Actual Results</button>
      </div>
      <button id="btn-sim" class="btn primary">🎲 Simulate</button>
      <button id="btn-reset" class="btn danger">↺ Reset</button>
      <div class="points">
        <span class="num" id="pts-num">–</span>
        <span class="sub" id="pts-sub">no tips yet</span>
      </div>
    </div>
  </header>

  <div class="instructions">
    Tap any match to enter your score prediction &nbsp;·&nbsp; watch winners <b>advance</b> through the bracket &nbsp;·&nbsp; hit <b>Simulate</b> to run the real tournament and score your tips &nbsp;·&nbsp; <b>3 pts</b> exact score, <b>1 pt</b> correct winner
  </div>
  <div id="champion-banner"></div>

  <div id="bracket-scroll">
    <div id="bracket-content">
      <div id="round-labels"></div>
      <div id="cols">
        <svg id="connectors"></svg>
      </div>
    </div>
  </div>

  <div id="modal-overlay">
    <div id="modal"><div id="modal-body"></div></div>
  </div>
  <div id="toast"></div>

<script>
(function(){
'use strict';

/* ---------------- Teams ---------------- */
const T=(name,flag,code)=>({name,flag,code});
const ARG=T('Argentina','🇦🇷','ARG'), KSA=T('Saudi Arabia','🇸🇦','KSA'),
      FRA=T('France','🇫🇷','FRA'),   JPN=T('Japan','🇯🇵','JPN'),
      ESP=T('Spain','🇪🇸','ESP'),    MAR=T('Morocco','🇲🇦','MAR'),
      ENG=T('England','🏴󠁧󠁢󠁥󠁮󠁧󠁿','ENG'),  IRN=T('Iran','🇮🇷','IRN'),
      GER=T('Germany','🇩🇪','GER'),  AUS=T('Australia','🇦🇺','AUS'),
      POR=T('Portugal','🇵🇹','POR'), SEN=T('Senegal','🇸🇳','SEN'),
      NED=T('Netherlands','🇳🇱','NED'),USA=T('USA','🇺🇸','USA'),
      BRA=T('Brazil','🇧🇷','BRA'),   CAN=T('Canada','🇨🇦','CAN'),
      BEL=T('Belgium','🇧🇪','BEL'),  EGY=T('Egypt','🇪🇬','EGY'),
      ITA=T('Italy','🇮🇹','ITA'),    NGA=T('Nigeria','🇳🇬','NGA'),
      CRO=T('Croatia','🇭🇷','CRO'),  ALG=T('Algeria','🇩🇿','ALG'),
      SUI=T('Switzerland','🇨🇭','SUI'),CHI=T('Chile','🇨🇱','CHI'),
      DEN=T('Denmark','🇩🇰','DEN'),  COL=T('Colombia','🇨🇴','COL'),
      POL=T('Poland','🇵🇱','POL'),   URU=T('Uruguay','🇺🇾','URU'),
      NOR=T('Norway','🇳🇴','NOR'),   ECU=T('Ecuador','🇪🇨','ECU'),
      MEX=T('Mexico','🇲🇽','MEX'),   QAT=T('Qatar','🇶🇦','QAT');

const R32=[
  [ARG,KSA],[FRA,JPN],[ESP,MAR],[ENG,IRN],
  [GER,AUS],[POR,SEN],[NED,USA],[BRA,CAN],
  [BEL,EGY],[ITA,NGA],[CRO,ALG],[SUI,CHI],
  [DEN,COL],[POL,URU],[NOR,ECU],[MEX,QAT]
];

const ROUND_LABEL={R32:'Round of 32',R16:'Round of 16',QF:'Quarter-finals',SF:'Semi-finals',Final:'Final'};
const ROUND_IDX={R32:0,R16:1,QF:2,SF:3,Final:4};
const COL_LABEL={0:'Round of 32',1:'Round of 16',2:'Quarter-finals',3:'Semi-finals',4:'Final',5:'Semi-finals',6:'Quarter-finals',7:'Round of 16',8:'Round of 32'};

/* ---------------- Build matches ---------------- */
function buildMatches(){
  const m=[];
  for(let i=0;i<16;i++){
    m.push({id:i,round:'R32',col:i<8?0:8,order:i<8?i:i-8,
      fixedA:R32[i][0],fixedB:R32[i][1],
      predA:null,predB:null,predPen:null,actA:null,actB:null,actPen:null,
      feeders:null,next:16+Math.floor(i/2),nextSlot:i%2===0?'A':'B'});
  }
  for(let i=16;i<24;i++){
    const j=i-16;
    m.push({id:i,round:'R16',col:j<4?1:7,order:j<4?j:j-4,
      predA:null,predB:null,predPen:null,actA:null,actB:null,actPen:null,
      feeders:[(j<4?0:8)+(j%4)*2,(j<4?0:8)+(j%4)*2+1],
      next:24+Math.floor(j/2),nextSlot:j%2===0?'A':'B'});
  }
  for(let i=24;i<28;i++){
    const k=i-24;
    m.push({id:i,round:'QF',col:k<2?2:6,order:k<2?k:k-2,
      predA:null,predB:null,predPen:null,actA:null,actB:null,actPen:null,
      feeders:[16+k*2,16+k*2+1],
      next:28+Math.floor(k/2),nextSlot:k%2===0?'A':'B'});
  }
  m.push({id:28,round:'SF',col:3,order:0,predA:null,predB:null,predPen:null,actA:null,actB:null,actPen:null,feeders:[24,25],next:30,nextSlot:'A'});
  m.push({id:29,round:'SF',col:5,order:0,predA:null,predB:null,predPen:null,actA:null,actB:null,actPen:null,feeders:[26,27],next:30,nextSlot:'B'});
  m.push({id:30,round:'Final',col:4,order:0,predA:null,predB:null,predPen:null,actA:null,actB:null,actPen:null,feeders:[28,29],next:null,nextSlot:null});
  return m;
}

const matches=buildMatches();
const state={view:'pred',simulated:false};
const prevFilled=new Set();
const prevTeam={};
const cardEls={};

/* ---------------- DOM refs ---------------- */
const labelsEl=document.getElementById('round-labels');
const colsEl=document.getElementById('cols');
const svg=document.getElementById('connectors');
const togPred=document.getElementById('tog-pred');
const togAct=document.getElementById('tog-act');
const btnSim=document.getElementById('btn-sim');
const btnReset=document.getElementById('btn-reset');
const ptsNum=document.getElementById('pts-num');
const ptsSub=document.getElementById('pts-sub');
const banner=document.getElementById('champion-banner');
const overlay=document.getElementById('modal-overlay');
const modalBody=document.getElementById('modal-body');
const toastEl=document.getElementById('toast');

/* ---------------- Core logic ---------------- */
function winnerSide(m,mode){
  const a=mode==='pred'?m.predA:m.actA, b=mode==='pred'?m.predB:m.actB;
  if(a==null||b==null) return null;
  if(a>b) return 'A'; if(b>a) return 'B';
  const pen=mode==='pred'?m.predPen:m.actPen;
  return pen||'A';
}
function resolve(mode){
  const teams={};
  for(const m of matches){
    if(m.round==='R32'){ teams[m.id]=[m.fixedA,m.fixedB]; }
    else{
      const fa=m.feeders[0], fb=m.feeders[1];
      const ta=teamOfWinner(fa,mode,teams), tb=teamOfWinner(fb,mode,teams);
      teams[m.id]=[ta,tb];
    }
  }
  return teams;
}
function teamOfWinner(id,mode,teams){
  const side=winnerSide(matches[id],mode);
  if(!side) return null;
  return side==='A'?teams[id][0]:teams[id][1];
}
function pointsFor(m){
  if(m.predA==null||m.predB==null) return null;
  if(m.actA==null||m.actB==null) return null;
  const exactScore=m.predA===m.actA&&m.predB===m.actB;
  const draw=m.predA===m.predB;
  const exact=exactScore&&(!draw||m.predPen===m.actPen);
  if(exact) return 3;
  const pw=winnerSide(m,'pred'), aw=winnerSide(m,'act');
  return pw===aw?1:0;
}
function computePoints(){
  let pts=0,exact=0,winners=0,predCount=0;
  for(const m of matches){
    if(m.predA==null||m.predB==null) continue;
    predCount++;
    if(m.actA==null||m.actB==null) continue;
    const p=pointsFor(m);
    pts+=p; if(p===3)exact++; else if(p===1)winners++;
  }
  return {pts,exact,winners,predCount,poss:predCount*3};
}
function championPath(mode){
  const fin=matches[30], w=winnerSide(fin,mode);
  if(!w) return new Set();
  const path=new Set([30]);
  let id=30, side=w;
  while(true){
    const m=matches[id];
    if(m.round==='R32') break;
    const feeder=side==='A'?m.feeders[0]:m.feeders[1];
    path.add(feeder);
    const s=winnerSide(matches[feeder],mode);
    if(!s) break;
    side=s; id=feeder;
  }
  return path;
}
function randScore(){
  const r=Math.random();
  if(r<.22)return 0; if(r<.52)return 1; if(r<.78)return 2; if(r<.93)return 3; return 4;
}

/* ---------------- DOM build ---------------- */
function buildDOM(){
  for(let c=0;c<9;c++){
    const ld=document.createElement('div'); ld.className='lbl'; ld.textContent=COL_LABEL[c]; labelsEl.appendChild(ld);
    const col=document.createElement('div'); col.className='col';
    matches.filter(m=>m.col===c).sort((a,b)=>a.order-b.order).forEach(m=>col.appendChild(buildCard(m)));
    colsEl.appendChild(col);
  }
}
function buildCard(m){
  const card=document.createElement('div');
  card.className='match round-'+m.round;
  card.dataset.id=m.id;
  card.innerHTML=
    '<div class="team slot-a"><span class="flag"></span><span class="tname"></span><span class="score"></span></div>'+
    '<div class="team slot-b"><span class="flag"></span><span class="tname"></span><span class="score"></span></div>'+
    '<div class="pts-badge"></div>';
  card.addEventListener('click',()=>openModal(m.id));
  cardEls[m.id]=card;
  return card;
}

/* ---------------- Render ---------------- */
function animateSlot(row,m,slot){
  const dir=m.col<4?'left':(m.col>4?'right':(slot==='a'?'left':'right'));
  row.classList.remove('advance','from-left','from-right');
  void row.offsetWidth;
  row.classList.add('advance',dir==='left'?'from-left':'from-right');
  row.style.animationDelay=(ROUND_IDX[m.round]*120)+'ms';
}
function updateSlot(m,card,slot,team,score,isWin,isLose,mode,isPenWin){
  const row=card.querySelector('.slot-'+slot);
  const flagEl=row.querySelector('.flag'), nameEl=row.querySelector('.tname'),
        scoreEl=row.querySelector('.score');
  let penEl=row.querySelector('.pen');
  if(team){flagEl.textContent=team.flag;nameEl.textContent=team.name;row.classList.remove('tbd');}
  else{flagEl.textContent='🏳️';nameEl.textContent='TBD';row.classList.add('tbd');}
  scoreEl.textContent=(score==null)?'–':score;
  row.classList.toggle('winner',isWin);
  row.classList.toggle('loser',isLose);
  if(isPenWin){if(!penEl){penEl=document.createElement('span');penEl.className='pen';penEl.textContent='⚽';row.appendChild(penEl);}}
  else if(penEl){penEl.remove();}
  const key=mode+':'+m.id+':'+slot;
  const filled=!!team;
  if(filled&&(!prevFilled.has(key)||prevTeam[key]!==(team?team.code:''))){
    animateSlot(row,m,slot);
    prevFilled.add(key); prevTeam[key]=team?team.code:'';
  }else if(!filled&&prevFilled.has(key)){
    prevFilled.delete(key); delete prevTeam[key];
  }
}
function render(){
  const mode=state.view;
  const teams=resolve(mode);
  for(const m of matches){
    const card=cardEls[m.id];
    const [tA,tB]=teams[m.id];
    const a=mode==='pred'?m.predA:m.actA, b=mode==='pred'?m.predB:m.actB;
    const pen=mode==='pred'?m.predPen:m.actPen;
    const has=a!=null&&b!=null;
    const w=has?winnerSide(m,mode):null;
    updateSlot(m,card,'a',tA,a,w==='A',has&&w!=='A',mode,pen&&a===b&&pen==='A');
    updateSlot(m,card,'b',tB,b,w==='B',has&&w!=='B',mode,pen&&a===b&&pen==='B');
    const badge=card.querySelector('.pts-badge');
    if(mode==='act'){
      const p=pointsFor(m);
      if(p!=null){
        badge.style.display='block';
        badge.textContent=p;
        badge.className='pts-badge '+(p===3?'p3':p===1?'p1':'p0');
      }else{badge.style.display='none';}
    }else{badge.style.display='none';}
    card.classList.toggle('champion',m.id===30&&w!=null);
  }
  // champion banner
  const fin=matches[30], fw=winnerSide(fin,mode);
  if(fw){
    const champ=fw==='A'?teams[30][0]:teams[30][1];
    if(champ){banner.innerHTML='🏆 Champion &nbsp; <span class="cf">'+champ.flag+'</span> '+champ.name;banner.classList.add('show');}
    else{banner.classList.remove('show');}
  }else{banner.classList.remove('show');}
  // points
  const c=computePoints();
  if(!state.simulated){
    ptsNum.textContent='–';
    ptsSub.textContent=c.predCount?c.predCount+' tips · simulate to score':'no tips yet';
  }else{
    ptsNum.textContent=c.pts;
    ptsSub.textContent=c.exact+' exact · '+c.winners+' correct · '+c.predCount+' tips';
  }
  // toggle
  togPred.classList.toggle('active',state.view==='pred');
  togAct.classList.toggle('active',state.view==='act');
  togAct.disabled=!state.simulated;
  requestAnimationFrame(drawConnectors);
}

/* ---------------- Connectors ---------------- */
function drawConnectors(){
  const w=colsEl.scrollWidth, h=colsEl.offsetHeight;
  svg.setAttribute('width',w); svg.setAttribute('height',h);
  svg.style.width=w+'px'; svg.style.height=h+'px';
  const cr=colsEl.getBoundingClientRect();
  const path=championPath(state.view);
  let html='<defs><linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd54f"/><stop offset="1" stop-color="#ffb300"/></linearGradient></defs>';
  for(const m of matches){
    if(m.next==null) continue;
    const card=cardEls[m.id], ncard=cardEls[m.next];
    if(!card||!ncard) continue;
    const r=card.getBoundingClientRect(), nr=ncard.getBoundingClientRect();
    const side=m.col<4?'right':'left';
    const x1=side==='right'?(r.right-cr.left):(r.left-cr.left);
    const y1=r.top+r.height/2-cr.top;
    const x2=side==='right'?(nr.left-cr.left):(nr.right-cr.left);
    const y2=nr.top+nr.height/2-cr.top;
    const mx=(x1+x2)/2;
    const onPath=path.has(m.id)&&path.has(m.next);
    const stroke=onPath?'url(#goldGrad)':'rgba(255,255,255,.16)';
    const sw=onPath?3.5:2;
    html+='<path d="M '+x1+' '+y1+' L '+mx+' '+y1+' L '+mx+' '+y2+' L '+x2+' '+y2+'" fill="none" stroke="'+stroke+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round"'+(onPath?' filter="drop-shadow(0 0 4px rgba(255,213,79,.6))"':'')+'/>';
  }
  svg.innerHTML=html;
}

/* ---------------- Modal ---------------- */
function showModal(){overlay.classList.add('show');}
function closeModal(){overlay.classList.remove('show');modalBody.innerHTML='';}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),1900);}

function openModal(id){
  const m=matches[id];
  if(state.view==='act') openReadModal(m);
  else openEditModal(m);
}
function openEditModal(m){
  const teams=resolve('pred');
  const [tA,tB]=teams[m.id];
  if(!tA||!tB){toast('Resolve the previous round first! ⚽');return;}
  modalBody.innerHTML=
    '<h3 class="m-title">Your prediction <span class="m-round">'+ROUND_LABEL[m.round]+'</span></h3>'+
    '<div class="mm-teams">'+
      '<div class="mm-team"><div class="mm-flag">'+tA.flag+'</div><div class="mm-name">'+tA.name+'</div><input type="number" id="inA" min="0" max="99" value="'+(m.predA==null?'':m.predA)+'" inputmode="numeric"></div>'+
      '<div class="mm-vs">vs</div>'+
      '<div class="mm-team"><div class="mm-flag">'+tB.flag+'</div><div class="mm-name">'+tB.name+'</div><input type="number" id="inB" min="0" max="99" value="'+(m.predB==null?'':m.predB)+'" inputmode="numeric"></div>'+
    '</div>'+
    '<div id="pen-box" hidden><div class="pen-label">Scores level — who wins the shootout?</div><div class="pen-btns">'+
      '<button type="button" data-pen="A" class="pen-btn">'+tA.flag+' '+tA.name+'</button>'+
      '<button type="button" data-pen="B" class="pen-btn">'+tB.flag+' '+tB.name+'</button>'+
    '</div></div>'+
    '<div class="mm-actions"><button type="button" id="m-clear" class="btn">Clear</button><button type="button" id="m-cancel" class="btn">Cancel</button><button type="button" id="m-save" class="btn primary">Save prediction</button></div>';

  const inA=document.getElementById('inA'), inB=document.getElementById('inB'),
        penBox=document.getElementById('pen-box');
  let penSel=m.predPen||'A';
  function syncPen(){
    const a=inA.value,b=inB.value;
    penBox.hidden=!(a!==''&&b!==''&&+a===+b);
  }
  function refreshPen(){penBox.querySelectorAll('.pen-btn').forEach(b=>b.classList.toggle('sel',b.dataset.pen===penSel));}
  inA.addEventListener('input',syncPen); inB.addEventListener('input',syncPen);
  penBox.querySelectorAll('.pen-btn').forEach(b=>b.addEventListener('click',()=>{penSel=b.dataset.pen;refreshPen();}));
  syncPen();refreshPen();
  const save=()=>{
    if(inA.value===''||inB.value===''){toast('Enter both scores');return;}
    const ai=+inA.value, bi=+inB.value;
    if(!Number.isInteger(ai)||!Number.isInteger(bi)||ai<0||bi<0){toast('Invalid scores');return;}
    m.predA=ai;m.predB=bi;
    m.predPen=(ai===bi)?penSel:null;
    closeModal();render();
  };
  document.getElementById('m-save').addEventListener('click',save);
  document.getElementById('m-cancel').addEventListener('click',closeModal);
  document.getElementById('m-clear').addEventListener('click',()=>{
    m.predA=null;m.predB=null;m.predPen=null;closeModal();render();
  });
  inA.addEventListener('keydown',e=>{if(e.key==='Enter')save();});
  inB.addEventListener('keydown',e=>{if(e.key==='Enter')save();});
  showModal();setTimeout(()=>inA.focus(),60);
}
function openReadModal(m){
  const teams=resolve('act');
  const predTeams=resolve('pred');
  const [tA,tB]=teams[m.id];
  const a=m.actA,b=m.actB,pen=m.actPen,w=winnerSide(m,'act');
  const p=pointsFor(m);
  const [pA,pB]=predTeams[m.id];
  let tipTxt='— no tip —';
  if(m.predA!=null&&m.predB!=null){
    tipTxt=m.predA+' : '+m.predB+(m.predPen?(' · '+(m.predPen==='A'?(pA?pA.name:'TBD'):(pB?pB.name:'TBD'))+' on pens'):'');
  }
  const penTxt=pen?(' · '+(pen==='A'?(tA?tA.name:'TBD'):(tB?tB.name:'TBD'))+' on pens'):'';
  const ptCls=p===3?'gold':(p===1?'silver':'');
  const ptLabel=p==null?'—':(p+' pts'+(p===3?' (exact!)':p===1?' (winner)':''));
  modalBody.innerHTML=
    '<h3 class="m-title">Result <span class="m-round">'+ROUND_LABEL[m.round]+'</span></h3>'+
    '<div class="mm-teams">'+
      '<div class="mm-team '+(w==='A'?'win':'')+'"><div class="mm-flag">'+(tA?tA.flag:'🏳️')+'</div><div class="mm-name">'+(tA?tA.name:'TBD')+'</div><div class="rscore">'+(a!=null?a:'–')+(pen&&pen==='A'?' ⚽':'')+'</div></div>'+
      '<div class="mm-vs">–</div>'+
      '<div class="mm-team '+(w==='B'?'win':'')+'"><div class="mm-flag">'+(tB?tB.flag:'🏳️')+'</div><div class="mm-name">'+(tB?tB.name:'TBD')+'</div><div class="rscore">'+(b!=null?b:'–')+(pen&&pen==='B'?' ⚽':'')+'</div></div>'+
    '</div>'+
    '<div class="mm-compare">'+
      '<div class="cmp-row"><span>Your tip</span><span>'+tipTxt+'</span></div>'+
      '<div class="cmp-row"><span>Result</span><span>'+(a!=null?a:'–')+' : '+(b!=null?b:'–')+penTxt+'</span></div>'+
      '<div class="cmp-row"><span>Points</span><span class="cmp-pts '+ptCls+'">'+ptLabel+'</span></div>'+
    '</div>'+
    '<div class="mm-actions"><button type="button" id="m-close" class="btn primary">Close</button></div>';
  document.getElementById('m-close').addEventListener('click',closeModal);
  showModal();
}

/* ---------------- Actions ---------------- */
function simulate(){
  for(const m of matches){
    const a=randScore(),b=randScore();
    m.actA=a;m.actB=b;
    m.actPen=(a===b)?(Math.random()<.5?'A':'B'):null;
  }
  state.simulated=true;state.view='act';
  prevFilled.clear();for(const k in prevTeam)delete prevTeam[k];
  render();
  toast('Tournament simulated! Check your points 🎉');
}
function reset(){
  for(const m of matches){m.predA=m.predB=m.predPen=null;m.actA=m.actB=m.actPen=null;}
  state.simulated=false;state.view='pred';
  prevFilled.clear();for(const k in prevTeam)delete prevTeam[k];
  render();
  toast('Bracket reset!');
}
function clearPrev(){prevFilled.clear();for(const k in prevTeam)delete prevTeam[k];}

/* ---------------- Events ---------------- */
togPred.addEventListener('click',()=>{if(state.view==='pred')return;state.view='pred';clearPrev();render();});
togAct.addEventListener('click',()=>{if(!state.simulated||state.view==='act')return;state.view='act';clearPrev();render();});
btnSim.addEventListener('click',simulate);
btnReset.addEventListener('click',reset);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
window.addEventListener('resize',()=>requestAnimationFrame(drawConnectors));

/* ---------------- Init ---------------- */
buildDOM();
render();
setTimeout(drawConnectors,250);
setTimeout(drawConnectors,800);
})();
</script>
</body>
