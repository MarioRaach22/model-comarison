<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handwritten Digit Classifier - LiteRT.js</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #fff;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 500px;
      width: 100%;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.5rem;
      color: #e94560;
    }
    
    .subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    
    .canvas-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    
    canvas {
      border: 2px solid #e94560;
      border-radius: 8px;
      background: #000;
      cursor: crosshair;
      touch-action: none;
    }
    
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 24px;
    }
    
    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-predict {
      background: #e94560;
      color: white;
    }
    
    .btn-predict:hover:not(:disabled) {
      background: #ff6b6b;
      transform: translateY(-2px);
    }
    
    .btn-clear {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .btn-clear:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .results {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .result-label {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .result-digit {
      font-size: 4rem;
      font-weight: bold;
      color: #e94560;
      line-height: 1;
    }
    
    .result-confidence {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 8px;
    }
    
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .error {
      color: #ff6b6b;
      font-size: 0.9rem;
    }
    
    .instructions {
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.8rem;
      margin-top: 16px;
    }
    
    .accelerator-info {
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.75rem;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Digit Classifier</h1>
    <p class="subtitle">Draw a digit (0-9) and tap Predict</p>
    
    <div class="canvas-container">
      <canvas id="canvas" width="280" height="280"></canvas>
    </div>
    
    <div class="buttons">
      <button id="predictBtn" class="btn-predict">Predict</button>
      <button id="clearBtn" class="btn-clear">Clear</button>
    </div>
    
    <div class="results" id="results">
      <div class="loading">
        <div class="spinner"></div>
        <span>Loading model...</span>
      </div>
    </div>
    
    <p class="instructions">Use your mouse or finger to draw</p>
    <p class="accelerator-info" id="acceleratorInfo"></p>
  </div>

  <script type="module">
    import { loadLiteRt, loadAndCompile, Tensor } from 'https://cdn.jsdelivr.net/npm/@litertjs/core@2.5.2/+esm';
    
    // Model URL from HuggingFace
    const MODEL_URL = 'https://huggingface.co/jack-perlo/Lenet5-Mnist/resolve/main/lenet5_uint8_mnist.tflite';
    
    // Canvas setup
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const resultsDiv = document.getElementById('results');
    const predictBtn = document.getElementById('predictBtn');
    const clearBtn = document.getElementById('clearBtn');
    const acceleratorInfo = document.getElementById('acceleratorInfo');
    
    let model = null;
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;
    
    // Drawing settings
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 20;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    // Mouse events
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);
    
    // Touch events
    canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
    canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);
    
    function getTouchPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (e.touches[0].clientX - rect.left) * scaleX,
        y: (e.touches[0].clientY - rect.top) * scaleY
      };
    }
    
    function handleTouchStart(e) {
      e.preventDefault();
      const pos = getTouchPos(e);
      startDrawingAt(pos.x, pos.y);
    }
    
    function handleTouchMove(e) {
      e.preventDefault();
      const pos = getTouchPos(e);
      drawAt(pos.x, pos.y);
    }
    
    function startDrawing(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      startDrawingAt(
        (e.clientX - rect.left) * scaleX,
        (e.clientY - rect.top) * scaleY
      );
    }
    
    function draw(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      drawAt(
        (e.clientX - rect.left) * scaleX,
        (e.clientY - rect.top) * scaleY
      );
    }
    
    function startDrawingAt(x, y) {
      isDrawing = true;
      lastX = x;
      lastY = y;
    }
    
    function drawAt(x, y) {
      if (!isDrawing) return;
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(x, y);
      ctx.stroke();
      lastX = x;
      lastY = y;
    }
    
    function stopDrawing() {
      isDrawing = false;
    }
    
    clearBtn.addEventListener('click', () => {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      showResults('<div class="loading"><span>Draw a digit...</span></div>');
    });
    
    function showResults(html) {
      resultsDiv.innerHTML = html;
    }
    
    function showError(msg) {
      showResults(`<div class="error">${msg}</div>`);
    }
    
    predictBtn.addEventListener('click', async () => {
      if (!model) {
        showError('Model not loaded yet');
        return;
      }
      
      try {
        predictBtn.disabled = true;
        showResults('<div class="loading"><div class="spinner"></div><span>Predicting...</span></div>');
        
        // Get image data and preprocess
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const input = preprocessForMNIST(imageData);
        
        // Create tensor with shape [1, 784] for uint8 input
        const inputTensor = new Tensor(new Uint8Array(input), [1, 784]);
        
        // Run inference
        const outputs = await model.run([inputTensor]);
        
        // Get output tensor data
        const outputData = await outputs[0].moveTo('wasm');
        const probabilities = outputData.toTypedArray();
        
        // Find predicted digit and confidence
        let maxProb = 0;
        let predictedDigit = 0;
        for (let i = 0; i < probabilities.length; i++) {
          if (probabilities[i] > maxProb) {
            maxProb = probabilities[i];
            predictedDigit = i;
          }
        }
        
        // Clean up tensors
        inputTensor.delete();
        outputData.delete();
        outputs.delete();
        
        // Show results
        const confidence = (maxProb * 100).toFixed(1);
        showResults(`
          <div class="result-label">Predicted Digit</div>
          <div class="result-digit">${predictedDigit}</div>
          <div class="result-confidence">Confidence: ${confidence}%</div>
        `);
        
      } catch (err) {
        console.error('Prediction error:', err);
        showError(`Error: ${err.message}`);
      } finally {
        predictBtn.disabled = false;
      }
    });
    
    /**
     * Preprocess canvas image for MNIST model
     * - Convert to grayscale
     * - Resize to 28x28 (MNIST standard)
     * - Invert colors (MNIST has white digits on black background)
     * - Normalize to 0-255
     */
    function preprocessForMNIST(imageData) {
      const srcWidth = canvas.width;
      const srcHeight = canvas.height;
      const dstSize = 28;
      
      // Create grayscale version
      const gray = new Uint8Array(srcWidth * srcHeight);
      for (let i = 0; i < imageData.data.length; i += 4) {
        // Use green channel (drawing is white)
        gray[i / 4] = imageData.data[i + 1];
      }
      
      // Resize using simple bilinear interpolation
      const result = new Uint8Array(dstSize * dstSize);
      const scaleX = srcWidth / dstSize;
      const scaleY = srcHeight / dstSize;
      
      for (let dy = 0; dy < dstSize; dy++) {
        for (let dx = 0; dx < dstSize; dx++) {
          const sx = dx * scaleX;
          const sy = dy * scaleY;
          const x1 = Math.floor(sx);
          const y1 = Math.floor(sy);
          const x2 = Math.min(x1 + 1, srcWidth - 1);
          const y2 = Math.min(y1 + 1, srcHeight - 1);
          
          const fx = sx - x1;
          const fy = sy - y1;
          
          // Bilinear interpolation
          const p1 = gray[y1 * srcWidth + x1];
          const p2 = gray[y1 * srcWidth + x2];
          const p3 = gray[y2 * srcWidth + x1];
          const p4 = gray[y2 * srcWidth + x2];
          
          const value = p1 * (1 - fx) * (1 - fy) +
                        p2 * fx * (1 - fy) +
                        p3 * (1 - fx) * fy +
                        p4 * fx * fy;
          
          // Invert and normalize: bright pixels (drawing) become high values
          // MNIST expects white digits on black background
          result[dy * dstSize + dx] = 255 - Math.round(value);
        }
      }
      
      return result;
    }
    
    // Initialize LiteRT and load model
    async function init() {
      try {
        showResults('<div class="loading"><div class="spinner"></div><span>Loading LiteRT...</span></div>');
        
        // Load LiteRT WASM from CDN
        // Using 'wasm' accelerator for compatibility without COOP/COEP headers
        await loadLiteRt('https://cdn.jsdelivr.net/npm/@litertjs/core@2.5.2/wasm/');
        
        showResults('<div class="loading"><div class="spinner"></div><span>Loading MNIST model...</span></div>');
        
        // Load and compile model with WASM accelerator
        // This works without cross-origin isolation (no SharedArrayBuffer needed)
        model = await loadAndCompile(MODEL_URL, {
          accelerator: 'wasm'  // Single-threaded CPU via XNNPack
        });
        
        acceleratorInfo.textContent = 'Accelerator: XNNPack (CPU via WebAssembly)';
        
        showResults('<div class="loading"><span>Draw a digit and tap Predict</span></div>');
        
      } catch (err) {
        console.error('Initialization error:', err);
        showError(`Failed to load: ${err.message}`);
        acceleratorInfo.textContent = '';
      }
    }
    
    // Start initialization
    init();
  </script>
</body>
</html>
