<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC/USD • XMR/USD — Live Price Charts</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2300d4ff'/><path d='M33 68V32l17 13 17-13v36H50L33 68z' fill='white'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #16161f;
            --border: #1e1e2e;
            --cyan: #00d4ff;
            --orange: #ff8c00;
            --positive: #00ff88;
            --negative: #ff4466;
            --text-primary: #ffffff;
            --text-secondary: #6b7280;
            --text-muted: #4a5568;
            --glow-cyan: 0 0 20px rgba(0, 212, 255, 0.3);
            --glow-orange: 0 0 20px rgba(255, 140, 0, 0.3);
            --glow-positive: 0 0 20px rgba(0, 255, 136, 0.4);
            --glow-negative: 0 0 20px rgba(255, 68, 102, 0.4);
        }

        ::selection {
            background: var(--cyan);
            color: var(--bg);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--surface);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            background-image: 
                radial-gradient(ellipse at top, rgba(0, 212, 255, 0.03) 0%, transparent 50%),
                linear-gradient(180deg, var(--bg) 0%, #0d0d14 100%);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        /* ───── Header ───── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 24px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .coin-logo {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            transition: opacity 0.3s ease;
        }

        .header-text h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-text span {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* ───── View Toggle (animated pill) ───── */
        .view-toggle-wrap {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 3px;
            display: flex;
            overflow: hidden;
        }

        .view-toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            bottom: 3px;
            width: calc(33.333% - 2.67px);
            background: var(--cyan);
            border-radius: 7px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s ease;
            z-index: 0;
        }

        .view-toggle-slider.xmr-mode {
            transform: translateX(100%);
            background: var(--orange);
        }

        .view-toggle-slider.compare-mode {
            transform: translateX(200%);
            background: linear-gradient(90deg, var(--cyan), var(--orange));
        }

        .view-btn {
            position: relative;
            z-index: 1;
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 0.8125rem;
            font-weight: 600;
            border-radius: 7px;
            cursor: pointer;
            transition: color 0.3s ease;
            flex: 1;
            white-space: nowrap;
        }

        .view-btn.active {
            color: var(--bg);
        }

        .view-btn:focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: -2px;
        }

        /* ───── Price Cards ───── */
        .price-cards {
            display: grid;
            gap: 16px;
            margin-bottom: 24px;
            transition: grid-template-columns 0.4s ease;
        }

        .price-cards.dual {
            grid-template-columns: 1fr 1fr;
        }

        .price-cards.single {
            grid-template-columns: 1fr;
        }

        .price-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 28px;
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.3s ease, opacity 0.4s ease, transform 0.4s ease;
        }

        .price-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
            opacity: 0.5;
        }

        .price-card.xmr-card::before {
            background: linear-gradient(90deg, transparent, var(--orange), transparent);
        }

        .price-card.positive-glow {
            box-shadow: var(--glow-positive);
        }

        .price-card.negative-glow {
            box-shadow: var(--glow-negative);
        }

        .price-card-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .price-card-head .asset-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .price-card-head .asset-dot.btc-dot {
            background: var(--cyan);
        }

        .price-card-head .asset-dot.xmr-dot {
            background: var(--orange);
        }

        .price-label {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .price-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(2rem, 6vw, 2.75rem);
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .price-value.updating {
            animation: pricePulse 0.3s ease;
        }

        @keyframes pricePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .price-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }

        .change-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8125rem;
            font-weight: 600;
        }

        .change-badge.positive {
            background: rgba(0, 255, 136, 0.1);
            color: var(--positive);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .change-badge.negative {
            background: rgba(255, 68, 102, 0.1);
            color: var(--negative);
            border: 1px solid rgba(255, 68, 102, 0.2);
        }

        .change-abs {
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        .last-updated {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: auto;
        }

        .last-updated.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .refresh-icon {
            width: 14px;
            height: 14px;
            transition: transform 0.3s ease;
        }

        .refresh-icon.spinning {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ───── 7d Stats Row ───── */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.4s ease, max-height 0.4s ease, margin-bottom 0.4s ease;
        }

        .stats-row.visible {
            opacity: 1;
            max-height: 100px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-label .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .stat-label .dot.btc-dot { background: var(--cyan); }
        .stat-label .dot.xmr-dot { background: var(--orange); }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .stat-value.positive { color: var(--positive); }
        .stat-value.negative { color: var(--negative); }

        .stat-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* ───── Time Range Selector ───── */
        .time-range-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            padding: 4px;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .range-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .range-btn:hover:not(.active):not(:disabled) {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .range-btn.active {
            background: var(--cyan);
            color: var(--bg);
            box-shadow: var(--glow-cyan);
        }

        .range-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ───── Chart Container ───── */
        .chart-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            min-height: 420px;
        }

        .chart-wrapper {
            position: relative;
            height: 360px;
        }

        .chart-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            border-radius: 12px;
            gap: 16px;
        }

        .chart-loading.hidden { display: none; }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .chart-error {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: var(--surface);
            border-radius: 12px;
        }

        .chart-error.hidden { display: none; }

        .error-icon {
            width: 48px;
            height: 48px;
            color: var(--negative);
        }

        .error-text {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .retry-btn {
            padding: 10px 20px;
            border: 1px solid var(--cyan);
            background: transparent;
            color: var(--cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .retry-btn:hover {
            background: var(--cyan);
            color: var(--bg);
        }

        /* ───── Compare Legend ───── */
        .chart-legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 16px;
        }

        .chart-legend.hidden { display: none; }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        .legend-line {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }

        /* ───── Footer ───── */
        .footer {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .footer-text {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--cyan);
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        /* ───── Skeleton ───── */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .skeleton {
            background: linear-gradient(90deg, var(--border) 25%, var(--surface) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }

        /* ───── Responsive ───── */
        @media (max-width: 700px) {
            .container { padding: 16px 12px; }

            .header { flex-direction: column; align-items: stretch; gap: 16px; }

            .view-toggle-wrap { align-self: flex-start; max-width: 320px; }

            .price-cards.dual { grid-template-columns: 1fr; }

            .price-card { padding: 20px 16px; }

            .price-meta { flex-direction: column; align-items: flex-start; gap: 8px; flex-wrap: wrap; }

            .last-updated { margin-left: 0; }

            .time-range-selector { flex-wrap: wrap; }

            .range-btn { flex: 0 0 calc(50% - 4px); }

            .chart-wrapper { height: 280px; }

            .stats-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ═══ Header ═══ -->
        <header class="header">
            <div class="header-left">
                <svg class="coin-logo" id="headerLogo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="48" fill="#00d4ff"/>
                    <path d="M55.5 24c-1.8 0-3.3 1.4-3.3 3.2v7.2c-2.7.6-5.2 1.3-7.5 2.1-.5.2-.8.8-.5 1.3l6.5 14c.2.4.6.7 1.1.7h3.5c1.8 0 3.3-1.4 3.3-3.2V38.3c2.1-.2 4.2-.3 6.3-.3 1.8 0 3.3-1.4 3.3-3.2v-7.2C66.2 25.4 64.8 24 63 24h-7.5zm.3 14.5c2.5 0 4.4.5 6.1 1.2V35c0 .9-.8 1.6-1.7 1.5-3.9-.5-7.1-.8-10.3-.7v-2c0-.9.8-1.6 1.7-1.5 1.5.2 2.9.3 4.2.3zm-10 5.2c2.1.2 4.3.4 6.6.6.8.1 1.5-.5 1.5-1.3v-3.8c.7.1 1.3.1 1.9.2.8.1 1.4-.5 1.5-1.2v-.6c0-.8.7-1.5 1.5-1.4 2.1.3 3.8.6 5.6 1v8.6c0 .9-.8 1.6-1.7 1.5-3.4-.5-6.3-.8-9.3-.7V53c0 .9-.8 1.6-1.7 1.5-2.1-.3-4.3-.6-6.6-.9-.8-.1-1.5.6-1.5 1.4v.8c0 .8-.7 1.5-1.5 1.4-.6-.1-1.2-.1-1.8-.2V42c0-.9.8-1.6 1.7-1.5 1.1.2 2.2.3 3.3.5z" fill="white"/>
                </svg>
                <div class="header-text">
                    <h1 id="headerTitle">BTC/USD</h1>
                    <span id="headerSub">Live Bitcoin Price</span>
                </div>
            </div>

            <!-- View Toggle -->
            <div class="view-toggle-wrap" role="radiogroup" aria-label="Chart view">
                <div class="view-toggle-slider" id="viewSlider"></div>
                <button class="view-btn active" data-view="btc" role="radio" aria-checked="true">BTC</button>
                <button class="view-btn" data-view="xmr" role="radio" aria-checked="false">XMR</button>
                <button class="view-btn" data-view="compare" role="radio" aria-checked="false">Compare</button>
            </div>
        </header>

        <!-- ═══ Price Cards ═══ -->
        <div class="price-cards single" id="priceCardsContainer">
            <!-- BTC Card -->
            <div class="price-card" id="btcCard">
                <div class="price-card-head">
                    <span class="asset-dot btc-dot"></span>
                    <span class="price-label">BTC / USD</span>
                </div>
                <div class="price-value" id="btcPriceValue">
                    <span class="skeleton" style="width: 200px; height: 44px; display: inline-block; border-radius: 8px;"></span>
                </div>
                <div class="price-meta">
                    <div class="price-change">
                        <span class="change-badge" id="btcChangeBadge">
                            <span class="skeleton" style="width: 90px; height: 26px; display: inline-block;"></span>
                        </span>
                        <span class="change-abs" id="btcChangeAbs">
                            <span class="skeleton" style="width: 70px; height: 18px; display: inline-block;"></span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- XMR Card -->
            <div class="price-card xmr-card" id="xmrCard">
                <div class="price-card-head">
                    <span class="asset-dot xmr-dot"></span>
                    <span class="price-label">XMR / USD</span>
                </div>
                <div class="price-value" id="xmrPriceValue">
                    <span class="skeleton" style="width: 200px; height: 44px; display: inline-block; border-radius: 8px;"></span>
                </div>
                <div class="price-meta">
                    <div class="price-change">
                        <span class="change-badge" id="xmrChangeBadge">
                            <span class="skeleton" style="width: 90px; height: 26px; display: inline-block;"></span>
                        </span>
                        <span class="change-abs" id="xmrChangeAbs">
                            <span class="skeleton" style="width: 70px; height: 18px; display: inline-block;"></span>
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ═══ Last Updated (shared) ═══ -->
        <div class="last-updated" id="lastUpdated" style="margin-bottom: 24px;">
            <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 11-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
            </svg>
            <span>Loading...</span>
        </div>

        <!-- ═══ 7d Stats Row ═══ -->
        <div class="stats-row" id="statsRow">
            <div class="stat-card">
                <div class="stat-label">
                    <span class="dot btc-dot"></span>
                    7-Day Performance
                </div>
                <div class="stat-value" id="btc7dStat">
                    <span class="skeleton" style="width: 80px; height: 22px; display: inline-block;"></span>
                </div>
                <div class="stat-sub">BTC / USD</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">
                    <span class="dot xmr-dot"></span>
                    7-Day Performance
                </div>
                <div class="stat-value" id="xmr7dStat">
                    <span class="skeleton" style="width: 80px; height: 22px; display: inline-block;"></span>
                </div>
                <div class="stat-sub">XMR / USD</div>
            </div>
        </div>

        <!-- ═══ Time Range Selector ═══ -->
        <div class="time-range-selector">
            <button class="range-btn" data-range="1" data-label="1H">1H</button>
            <button class="range-btn active" data-range="1" data-label="24H">24H</button>
            <button class="range-btn" data-range="7" data-label="7D">7D</button>
            <button class="range-btn" data-range="30" data-label="30D">30D</button>
        </div>

        <!-- ═══ Chart Container ═══ -->
        <div class="chart-container">
            <div class="chart-wrapper">
                <canvas id="priceChart"></canvas>
                <div class="chart-loading" id="chartLoading">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Loading chart data...</div>
                </div>
                <div class="chart-error hidden" id="chartError">
                    <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <div class="error-text">Unable to fetch chart data</div>
                    <button class="retry-btn" id="retryBtn">Retry</button>
                </div>
            </div>
            <!-- Compare Legend -->
            <div class="chart-legend hidden" id="chartLegend">
                <div class="legend-item">
                    <div class="legend-line" style="background: var(--cyan);"></div>
                    BTC / USD
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background: var(--orange);"></div>
                    XMR / USD
                </div>
            </div>
        </div>

        <!-- ═══ Footer ═══ -->
        <footer class="footer">
            <p class="footer-text">
                Data provided by <a href="https://www.binance.com/" target="_blank" rel="noopener">Binance</a> Public API
            </p>
        </footer>
    </div>

    <script>
        // ────── Config ──────
        const COINS = {
            btc: { symbol: 'BTCUSDT', label: 'BTC/USD', name: 'Bitcoin' },
            xmr: { symbol: 'XMRUSDT', label: 'XMR/USD', name: 'Monero' }
        };

        const COLORS = {
            btc: '#00d4ff',
            xmr: '#ff8c00',
            positive: '#00ff88',
            negative: '#ff4466'
        };

        // ────── State ──────
        const state = {
            prices:    { btc: null, xmr: null },
            prevPrices:{ btc: null, xmr: null },
            changes:   { btc: 0, xmr: 0 },
            selectedRange: 1,
            chartData: { btc: [], xmr: [] },
            lastUpdated: null,
            isLoading:  false,
            view: 'btc',             // 'btc' | 'xmr' | 'compare'
            chartInstance: null
        };

        // ────── DOM refs ──────
        const $ = id => document.getElementById(id);
        const els = {
            headerTitle:  $('headerTitle'),
            headerSub:    $('headerSub'),
            headerLogo:   $('headerLogo'),
            viewBtns:     document.querySelectorAll('.view-btn'),
            viewSlider:   $('viewSlider'),
            priceCards:   $('priceCardsContainer'),
            btcCard:      $('btcCard'),
            xmrCard:      $('xmrCard'),
            btcPrice:     $('btcPriceValue'),
            xmrPrice:     $('xmrPriceValue'),
            btcBadge:     $('btcChangeBadge'),
            xmrBadge:     $('xmrChangeBadge'),
            btcAbs:       $('btcChangeAbs'),
            xmrAbs:       $('xmrChangeAbs'),
            lastUpdated:  $('lastUpdated'),
            refreshIcon:  document.querySelector('.refresh-icon'),
            statsRow:     $('statsRow'),
            btc7dStat:    $('btc7dStat'),
            xmr7dStat:    $('xmr7dStat'),
            rangeBtns:    document.querySelectorAll('.range-btn'),
            chartCanvas:  $('priceChart'),
            chartLoading: $('chartLoading'),
            chartError:   $('chartError'),
            retryBtn:     $('retryBtn'),
            chartLegend:  $('chartLegend')
        };

        // ────── API ──────
        async function fetchTicker(symbol) {
            const resp = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}`);
            if (!resp.ok) throw new Error(`API ${symbol} failed`);
            const d = await resp.json();
            return {
                price: parseFloat(d.lastPrice),
                change: parseFloat(d.priceChangePercent)
            };
        }

        async function fetchKlines(symbol, days) {
            let interval, limit;
            if (days <= 1) {
                interval = '1m';
                limit = days < 1 ? 60 : 1440;
            } else if (days <= 7) {
                interval = '5m';
                limit = 2016;
            } else {
                interval = '1h';
                limit = 720;
            }

            const endTime = Date.now();
            const startTime = endTime - days * 24 * 60 * 60 * 1000;

            const resp = await fetch(
                `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&startTime=${startTime}&endTime=${endTime}&limit=${limit}`
            );
            if (!resp.ok) throw new Error(`API ${symbol} klines failed`);
            const data = await resp.json();
            return data.map(k => ({ timestamp: k[0], price: parseFloat(k[4]) }));
        }

        async function fetchBothPrices() {
            const [btc, xmr] = await Promise.all([
                fetchTicker('BTCUSDT'),
                fetchTicker('XMRUSDT')
            ]);
            return { btc, xmr };
        }

        // returns { btc: [...], xmr: [...] }
        async function fetchBothKlines(days) {
            const [btc, xmr] = await Promise.all([
                fetchKlines('BTCUSDT', days),
                fetchKlines('XMRUSDT', days)
            ]);
            return { btc, xmr };
        }

        // ────── Formatting ──────
        function fmtPrice(p) {
            return '$' + Number(p).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function fmtPriceRaw(p) {
            return '$' + Number(p).toLocaleString('en-US', {
                minimumFractionDigits: p < 1 ? 4 : 2,
                maximumFractionDigits: p < 1 ? 6 : 2
            });
        }

        function fmtPct(v) {
            return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
        }

        function fmtTimeAgo(ts) {
            const s = Math.floor((Date.now() - ts) / 1000);
            if (s < 5) return 'just now';
            if (s < 60) return s + 's ago';
            const m = Math.floor(s / 60);
            return m + 'm ' + (s % 60) + 's ago';
        }

        function fmtTsLabel(ts, range) {
            const d = new Date(ts);
            if (range <= 1) {
                return d.toLocaleString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            } else if (range <= 7) {
                return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
            }
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        // ────── View / Layout ──────
        function setView(view) {
            state.view = view;

            // slider animation
            els.viewSlider.className = 'view-toggle-slider';
            if (view === 'xmr') els.viewSlider.classList.add('xmr-mode');
            else if (view === 'compare') els.viewSlider.classList.add('compare-mode');

            // button active state
            els.viewBtns.forEach(btn => {
                const isActive = btn.dataset.view === view;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-checked', isActive);
            });

            // header
            if (view === 'btc') {
                els.headerTitle.textContent = 'BTC/USD';
                els.headerSub.textContent = 'Live Bitcoin Price';
                els.headerLogo.querySelector('circle').setAttribute('fill', '#00d4ff');
            } else if (view === 'xmr') {
                els.headerTitle.textContent = 'XMR/USD';
                els.headerSub.textContent = 'Live Monero Price';
                els.headerLogo.querySelector('circle').setAttribute('fill', '#ff8c00');
            } else {
                els.headerTitle.textContent = 'BTC/USD · XMR/USD';
                els.headerSub.textContent = 'Live Comparison';
                els.headerLogo.querySelector('circle').setAttribute('fill', 'url(#cg)');
            }

            // Price cards grid
            els.priceCards.classList.toggle('single', view !== 'compare');
            els.priceCards.classList.toggle('dual', view === 'compare');

            // Show/hide cards
            const showBtc = view === 'btc' || view === 'compare';
            const showXmr = view === 'xmr' || view === 'compare';
            els.btcCard.style.display = showBtc ? '' : 'none';
            els.xmrCard.style.display = showXmr ? '' : 'none';

            // Stats row
            els.statsRow.classList.toggle('visible', view === 'compare');

            // Legend
            els.chartLegend.classList.toggle('hidden', view !== 'compare');

            // Refresh chart
            updateChart(state.selectedRange, view);
        }

        // ────── Price Display ──────
        function updatePrices(data) {
            // BTC
            if (data.btc) {
                state.prevPrices.btc = state.prices.btc;
                state.prices.btc = data.btc.price;
                state.changes.btc = data.btc.change;
                updateSinglePriceCard('btc', data.btc);
            }

            // XMR
            if (data.xmr) {
                state.prevPrices.xmr = state.prices.xmr;
                state.prices.xmr = data.xmr.price;
                state.changes.xmr = data.xmr.change;
                updateSinglePriceCard('xmr', data.xmr);
            }

            state.lastUpdated = Date.now();
            updateTimeAgo();
        }

        function updateSinglePriceCard(coin, data) {
            const priceEl = coin === 'btc' ? els.btcPrice : els.xmrPrice;
            const badgeEl = coin === 'btc' ? els.btcBadge : els.xmrBadge;
            const absEl   = coin === 'btc' ? els.btcAbs   : els.xmrAbs;
            const card    = coin === 'btc' ? els.btcCard   : els.xmrCard;

            card.classList.remove('positive-glow', 'negative-glow');
            if (state.prevPrices[coin] !== null) {
                const dir = data.price > state.prevPrices[coin] ? 'positive' :
                            data.price < state.prevPrices[coin] ? 'negative' : null;
                if (dir) card.classList.add(dir + '-glow');
            }

            priceEl.classList.add('updating');
            setTimeout(() => priceEl.classList.remove('updating'), 300);
            priceEl.textContent = fmtPrice(data.price);

            const cls = data.change >= 0 ? 'positive' : 'negative';
            const arrow = data.change >= 0 ? '▲' : '▼';
            badgeEl.className = `change-badge ${cls}`;
            badgeEl.innerHTML = `${arrow} ${fmtPct(data.change)}`;

            const absVal = data.price * (data.change / 100);
            const sign = absVal >= 0 ? '+' : '';
            absEl.textContent = `${sign}$${Math.abs(absVal).toFixed(2)} (24h)`;
        }

        function updateTimeAgo() {
            if (!state.lastUpdated) return;
            const span = els.lastUpdated.querySelector('span');
            span.textContent = 'Updated ' + fmtTimeAgo(state.lastUpdated);
        }

        // ────── 7d Stats ──────
        function update7dStats(data) {
            // data: { btc: [...], xmr: [...] }
            const calc = (arr) => {
                if (!arr || arr.length < 2) return null;
                const first = arr[0].price;
                const last  = arr[arr.length - 1].price;
                return ((last - first) / first) * 100;
            };

            const btc7d = calc(data.btc);
            const xmr7d = calc(data.xmr);

            if (btc7d !== null) {
                const cls = btc7d >= 0 ? 'positive' : 'negative';
                els.btc7dStat.className = `stat-value ${cls}`;
                els.btc7dStat.textContent = (btc7d >= 0 ? '+' : '') + btc7d.toFixed(2) + '%';
            }
            if (xmr7d !== null) {
                const cls = xmr7d >= 0 ? 'positive' : 'negative';
                els.xmr7dStat.className = `stat-value ${cls}`;
                els.xmr7dStat.textContent = (xmr7d >= 0 ? '+' : '') + xmr7d.toFixed(2) + '%';
            }
        }

        // ────── Chart ──────
        function buildGradient(ctx, height, color) {
            const g = ctx.createLinearGradient(0, 0, 0, height);
            g.addColorStop(0, color + '33');  // 0.2 alpha
            g.addColorStop(1, color + '00');
            return g;
        }

        function getChartConfig(view, range, data) {
            const ctx = els.chartCanvas.getContext('2d');
            const height = 360;

            // Sampling
            const maxPts = range === 1 ? 60 : range === 7 ? 168 : 90;
            const sample = (arr) => {
                if (!arr || arr.length === 0) return [];
                const step = Math.max(1, Math.floor(arr.length / maxPts));
                return arr.filter((_, i) => i % step === 0 || i === arr.length - 1);
            };

            const datasets = [];
            const labels = [];

            if (view === 'btc') {
                const pts = data.btc || [];
                const s = sample(pts);
                const lastUp = s.length > 1 && s[s.length-1].price >= s[0].price;
                const lineColor = lastUp ? COLORS.positive : COLORS.negative;
                const gradColor = lastUp ? '#00ff88' : '#ff4466';

                s.forEach(d => labels.push(fmtTsLabel(d.timestamp, range)));
                datasets.push({
                    label: 'BTC/USD',
                    data: s.map(d => d.price),
                    borderColor: lineColor,
                    backgroundColor: buildGradient(ctx, height, gradColor),
                    borderWidth: 2.5,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 6,
                    pointHoverBackgroundColor: lineColor,
                    pointHoverBorderColor: '#fff',
                    pointHoverBorderWidth: 2,
                    yAxisID: 'y'
                });
            } else if (view === 'xmr') {
                const pts = data.xmr || [];
                const s = sample(pts);
                const lastUp = s.length > 1 && s[s.length-1].price >= s[0].price;
                const lineColor = lastUp ? COLORS.positive : COLORS.negative;
                const gradColor = lastUp ? '#00ff88' : '#ff4466';

                s.forEach(d => labels.push(fmtTsLabel(d.timestamp, range)));
                datasets.push({
                    label: 'XMR/USD',
                    data: s.map(d => d.price),
                    borderColor: lineColor,
                    backgroundColor: buildGradient(ctx, height, gradColor),
                    borderWidth: 2.5,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 6,
                    pointHoverBackgroundColor: lineColor,
                    pointHoverBorderColor: '#fff',
                    pointHoverBorderWidth: 2,
                    yAxisID: 'y'
                });
            } else {
                // Comparison mode: normalise both to % change from first point
                const btcPts = data.btc || [];
                const xmrPts = data.xmr || [];

                // Use the longer array for labels
                const ref = btcPts.length >= xmrPts.length ? btcPts : xmrPts;
                const sRef = sample(ref);
                sRef.forEach(d => labels.push(fmtTsLabel(d.timestamp, range)));

                // Align: sample on the same timestamps
                // We'll build interpolated datasets
                const buildNorm = (arr) => {
                    if (!arr || arr.length < 2) return [];
                    const base = arr[0].price;
                    const sampled = sample(arr);
                    return sampled.map(d => ({ ...d, pct: ((d.price - base) / base) * 100 }));
                };

                const btcNorm = buildNorm(btcPts);
                const xmrNorm = buildNorm(xmrPts);

                // Use the longer for labels
                const labelArr = btcNorm.length >= xmrNorm.length ? btcNorm : xmrNorm;
                // But keep labels from the ref set
                const labelMap = {};
                ref.forEach(d => { labelMap[d.timestamp] = fmtTsLabel(d.timestamp, range); });

                datasets.push({
                    label: 'BTC / USD',
                    data: btcNorm.map(d => d.pct),
                    borderColor: COLORS.btc,
                    backgroundColor: buildGradient(ctx, height, COLORS.btc),
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 5,
                    pointHoverBackgroundColor: COLORS.btc,
                    pointHoverBorderColor: '#fff',
                    pointHoverBorderWidth: 2,
                    yAxisID: 'y'
                });

                datasets.push({
                    label: 'XMR / USD',
                    data: xmrNorm.map(d => d.pct),
                    borderColor: COLORS.xmr,
                    backgroundColor: buildGradient(ctx, height, COLORS.xmr),
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 5,
                    pointHoverBackgroundColor: COLORS.xmr,
                    pointHoverBorderColor: '#fff',
                    pointHoverBorderWidth: 2,
                    yAxisID: 'y'
                });
            }

            const isCompare = view === 'compare';

            return {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 600,
                        easing: 'easeOutQuart'
                    },
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            enabled: true,
                            backgroundColor: '#12121a',
                            titleColor: '#fff',
                            bodyColor: '#6b7280',
                            borderColor: '#1e1e2e',
                            borderWidth: 1,
                            padding: 12,
                            cornerRadius: 8,
                            displayColors: isCompare,
                            titleFont: { family: "'JetBrains Mono', monospace", size: 12, weight: '600' },
                            bodyFont: { family: "'JetBrains Mono', monospace", size: 13, weight: '700' },
                            callbacks: {
                                title: items => items[0]?.label || '',
                                label: function(item) {
                                    if (isCompare) {
                                        const coin = item.dataset.label === 'BTC / USD' ? 'BTC' : 'XMR';
                                        return coin + ': ' + item.raw.toFixed(2) + '%';
                                    }
                                    return fmtPriceRaw(item.raw);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(30, 30, 46, 0.5)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#4a5568',
                                font: { family: "'Inter', sans-serif", size: 10 },
                                maxRotation: 0,
                                maxTicksLimit: 6
                            }
                        },
                        y: {
                            position: 'right',
                            grid: {
                                color: 'rgba(30, 30, 46, 0.5)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#4a5568',
                                font: { family: "'JetBrains Mono', monospace", size: 10 },
                                callback: function(value) {
                                    if (isCompare) return value.toFixed(1) + '%';
                                    return '$' + Number(value).toLocaleString();
                                }
                            }
                        }
                    }
                }
            };
        }

        async function updateChart(range, view) {
            view = view || state.view;
            setLoading(true);

            try {
                const data = await fetchBothKlines(range);
                state.chartData = data;
                state.selectedRange = range;

                if (state.chartInstance) {
                    state.chartInstance.destroy();
                }

                const config = getChartConfig(view, range, data);
                state.chartInstance = new Chart(els.chartCanvas, config);

                els.chartError.classList.add('hidden');

                // Update 7d stats if compare
                if (view === 'compare') {
                    update7dStats(data);
                }
            } catch (err) {
                showError(err.message);
            } finally {
                setLoading(false);
            }
        }

        // ────── UI Helpers ──────
        function setLoading(isLoading) {
            els.chartLoading.classList.toggle('hidden', !isLoading);
            if (isLoading) els.chartError.classList.add('hidden');
            els.rangeBtns.forEach(b => b.disabled = isLoading);
        }

        function showError(msg) {
            els.chartError.classList.remove('hidden');
            els.chartLoading.classList.add('hidden');
        }

        // ────── Event Handlers ──────
        function handleViewClick(e) {
            const btn = e.currentTarget;
            const view = btn.dataset.view;
            if (view === state.view) return;
            setView(view);
        }

        function handleRangeClick(e) {
            const btn = e.currentTarget;
            const range = parseInt(btn.dataset.range);
            els.rangeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateChart(range, state.view);
        }

        async function handleRefresh() {
            els.refreshIcon.classList.add('spinning');
            try {
                const data = await fetchBothPrices();
                updatePrices(data);
            } catch (err) {
                console.error('Refresh failed:', err);
            } finally {
                els.refreshIcon.classList.remove('spinning');
            }
        }

        // ────── Init ──────
        async function init() {
            // View toggle
            els.viewBtns.forEach(btn => btn.addEventListener('click', handleViewClick));

            // Range buttons
            els.rangeBtns.forEach(btn => btn.addEventListener('click', handleRangeClick));

            // Retry
            els.retryBtn.addEventListener('click', () => updateChart(state.selectedRange, state.view));

            // Initial prices
            try {
                const prices = await fetchBothPrices();
                updatePrices(prices);
            } catch (err) {
                ['btcPrice','xmrPrice'].forEach(id => {
                    document.getElementById(id).textContent = '--';
                });
                ['btcBadge','xmrBadge'].forEach(id => {
                    document.getElementById(id).textContent = '--';
                });
            }

            // Initial chart (BTC view, 24H)
            state.view = 'btc';
            await updateChart(1, 'btc');
            els.rangeBtns[1].classList.add('active');  // 24H active

            // Auto-refresh every 10s
            setInterval(handleRefresh, 10000);
            setInterval(updateTimeAgo, 1000);
        }

        init();
    </script>
</body>
</html>
