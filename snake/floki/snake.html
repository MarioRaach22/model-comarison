<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 20px;
            max-width: 100%;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            color: #eee;
            font-size: 18px;
        }
        
        .score {
            font-weight: bold;
            color: #4ecca3;
        }
        
        canvas {
            background: #16213e;
            border: 3px solid #4ecca3;
            border-radius: 8px;
            max-width: 100%;
        }
        
        .controls-info {
            color: #888;
            font-size: 14px;
            text-align: center;
        }
        
        .controls-info span {
            color: #4ecca3;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div>Score: <span class="score" id="score">0</span></div>
            <div>Best: <span class="score" id="best">0</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls-info">
            Controls: <span>Arrow Keys</span> or <span>WASD</span> &nbsp;|&nbsp; <span>Space</span> to Start/Restart
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');

        // Grid settings
        const gridSize = 20;
        let tileCount;

        // Game state
        let gameState = 'start'; // 'start', 'playing', 'gameover'
        let snake = [];
        let food = {};
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let bestScore = 0;
        let gameSpeed = 150;
        let lastTime = 0;
        let accumulator = 0;

        // Responsive canvas sizing
        function resizeCanvas() {
            const containerWidth = Math.min(window.innerWidth - 40, 400);
            const size = Math.floor(containerWidth / gridSize) * gridSize;
            canvas.width = size;
            canvas.height = size;
            tileCount = size / gridSize;
        }

        // Initialize/reset game
        function initGame() {
            const startX = Math.floor(tileCount / 2);
            const startY = Math.floor(tileCount / 2);
            snake = [{ x: startX, y: startY }];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameSpeed = 150;
            scoreEl.textContent = score;
            spawnFood();
        }

        // Spawn food at random position
        function spawnFood() {
            let validPosition = false;
            while (!validPosition) {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                validPosition = !snake.some(seg => seg.x === food.x && seg.y === food.y);
            }
        }

        // Draw game
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'start') {
                drawStartScreen();
                return;
            }

            if (gameState === 'gameover') {
                drawGame();
                drawGameOver();
                return;
            }

            drawGame();
        }

        function drawGame() {
            // Draw snake
            snake.forEach((segment, index) => {
                const alpha = 1 - (index / snake.length) * 0.4;
                ctx.fillStyle = `rgba(78, 204, 163, ${alpha})`;
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );
            });

            // Draw head with different color
            ctx.fillStyle = '#4ecca3';
            ctx.fillRect(
                snake[0].x * gridSize + 1,
                snake[0].y * gridSize + 1,
                gridSize - 2,
                gridSize - 2
            );

            // Draw food
            ctx.fillStyle = '#e94560';
            ctx.fillRect(
                food.x * gridSize + 1,
                food.y * gridSize + 1,
                gridSize - 2,
                gridSize - 2
            );
        }

        function drawStartScreen() {
            ctx.fillStyle = '#eee';
            ctx.font = 'bold 32px Segoe UI, system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('SNAKE', canvas.width / 2, canvas.height / 2 - 40);

            ctx.font = '18px Segoe UI, system-ui, sans-serif';
            ctx.fillStyle = '#888';
            ctx.fillText('Press SPACE to Start', canvas.width / 2, canvas.height / 2 + 10);

            ctx.fillStyle = '#4ecca3';
            ctx.font = '14px Segoe UI, system-ui, sans-serif';
            ctx.fillText('Use Arrow Keys or WASD to move', canvas.width / 2, canvas.height / 2 + 50);
        }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#e94560';
            ctx.font = 'bold 28px Segoe UI, system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);

            ctx.fillStyle = '#eee';
            ctx.font = '20px Segoe UI, system-ui, sans-serif';
            ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 10);

            ctx.fillStyle = '#888';
            ctx.font = '16px Segoe UI, system-ui, sans-serif';
            ctx.fillText('Press SPACE to Restart', canvas.width / 2, canvas.height / 2 + 50);
        }

        // Update game logic
        function update() {
            if (gameState !== 'playing') return;

            direction = { ...nextDirection };

            // Calculate new head position
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            // Self collision
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // Food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > bestScore) {
                    bestScore = score;
                    bestEl.textContent = bestScore;
                }
                spawnFood();
                // Speed up gradually
                if (gameSpeed > 80) {
                    gameSpeed -= 2;
                }
            } else {
                snake.pop();
            }
        }

        function endGame() {
            gameState = 'gameover';
        }

        // Game loop
        function gameLoop(currentTime) {
            requestAnimationFrame(gameLoop);

            if (gameState !== 'playing') {
                draw();
                return;
            }

            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            accumulator += deltaTime;

            while (accumulator >= gameSpeed) {
                update();
                accumulator -= gameSpeed;
            }

            draw();
        }

        // Input handling
        function handleKeyDown(e) {
            const key = e.key.toLowerCase();

            // Start/restart with space
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameState === 'start' || gameState === 'gameover') {
                    gameState = 'playing';
                    initGame();
                    lastTime = performance.now();
                    accumulator = 0;
                }
                return;
            }

            if (gameState !== 'playing') return;

            // Direction controls
            switch (key) {
                case 'arrowup':
                case 'w':
                    e.preventDefault();
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'arrowdown':
                case 's':
                    e.preventDefault();
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'arrowleft':
                case 'a':
                    e.preventDefault();
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'arrowright':
                case 'd':
                    e.preventDefault();
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        }

        // Touch controls for mobile
        let touchStartX = 0;
        let touchStartY = 0;

        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }

        function handleTouchEnd(e) {
            if (gameState === 'start' || gameState === 'gameover') {
                gameState = 'playing';
                initGame();
                lastTime = performance.now();
                accumulator = 0;
                return;
            }

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30 && direction.x !== -1) {
                    nextDirection = { x: 1, y: 0 };
                } else if (dx < -30 && direction.x !== 1) {
                    nextDirection = { x: -1, y: 0 };
                }
            } else {
                if (dy > 30 && direction.y !== -1) {
                    nextDirection = { x: 0, y: 1 };
                } else if (dy < -30 && direction.y !== 1) {
                    nextDirection = { x: 0, y: -1 };
                }
            }
        }

        // Event listeners
        window.addEventListener('keydown', handleKeyDown);
        canvas.addEventListener('touchstart', handleTouchStart, { passive: true });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: true });
        window.addEventListener('resize', () => {
            resizeCanvas();
            draw();
        });

        // Initialize
        resizeCanvas();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
