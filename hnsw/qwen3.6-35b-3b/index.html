<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HNSW Visualizer</title>
<style>
  :root {
    --bg: #0f1117; --panel: #1a1d27; --border: #2a2d3a; --text: #e0e0e8;
    --muted: #8888a0; --accent: #6c8cff; --accent2: #ff6c6c;
    --green: #4cdb6c; --yellow: #ffd84c; --visited: #ff8c4c; --path: #c084fc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }
  header { background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 10px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 1.2em; font-weight: 600; margin-right: auto; }
  header h1 span { color: var(--accent); }
  .btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--panel); color: var(--text); cursor: pointer; font-size: 0.82em; transition: all .15s; }
  .btn:hover { background: #252836; border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .controls label { font-size: 0.8em; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .controls input[type="range"] { width: 70px; accent-color: var(--accent); }
  .controls select { padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--text); font-size: 0.8em; }
  .stats-bar { background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 8px 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; font-size: 0.82em; }
  .stat { display: flex; align-items: center; gap: 5px; }
  .stat .label { color: var(--muted); }
  .stat .value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .value.green { color: var(--green); }
  .stat .value.red { color: var(--accent2); }
  .stat .value.yellow { color: var(--yellow); }
  .stat .value.blue { color: var(--accent); }
  .recall-badge { padding: 3px 10px; border-radius: 12px; font-weight: 700; font-size: 0.88em; }
  .recall-badge.perfect { background: #1a3a1a; color: var(--green); }
  .recall-badge.imperfect { background: #3a1a1a; color: var(--accent2); }
  .main-area { display: flex; height: calc(100vh - 100px); }
  .sidebar { width: 270px; min-width: 270px; background: var(--panel);
    border-right: 1px solid var(--border); padding: 14px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px; }
  .sidebar h3 { font-size: 0.8em; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 4px; }
  .info-box { background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 10px; font-size: 0.8em; line-height: 1.5; }
  .info-box .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .info-box .row .k { color: var(--muted); }
  .info-box .row .v { font-weight: 600; }
  .canvas-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .layer-tabs { display: flex; background: var(--panel); border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: thin; }
  .layer-tab { padding: 7px 14px; cursor: pointer; font-size: 0.78em;
    color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; transition: all .15s; }
  .layer-tab:hover { color: var(--text); background: rgba(255,255,255,.03); }
  .layer-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .canvas-wrap { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.76em; color: var(--muted); }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .query-results { font-size: 0.78em; max-height: 180px; overflow-y: auto; }
  .query-results .item { display: flex; justify-content: space-between;
    padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .query-results .item.missed { opacity: 0.45; text-decoration: line-through; }
  .mode-indicator { padding: 3px 8px; border-radius: 4px; font-size: 0.78em; font-weight: 600; }
  .mode-indicator.search { background: #1a2a3a; color: var(--accent); }
  .mode-indicator.done { background: #1a3a1a; color: var(--green); }
</style>
</head>
<body>
<header>
  <h1>HNSW <span>Visualizer</span></h1>
  <div class="controls">
    <div class="btn-group">
      <button class="btn primary" id="btnInsert100">+100 Points</button>
      <button class="btn" id="btnRebuild4">M=4</button>
      <button class="btn" id="btnRebuild8">M=8</button>
      <button class="btn" id="btnRebuild16">M=16</button>
    </div>
    <label>efSearch: <input type="range" id="efSlider" min="5" max="200" value="40">
      <span id="efVal">40</span></label>
    <label>Speed: <input type="range" id="speedSlider" min="1" max="60" value="15" style="width:60px;accent-color:var(--yellow)">
      <span id="speedVal">15</span></label>
  </div>
</header>

<div class="stats-bar">
  <div class="stat"><span class="label">Points:</span><span class="value blue" id="statPoints">0</span></div>
  <div class="stat"><span class="label">Layers:</span><span class="value" id="statLayers">0</span></div>
  <div class="stat"><span class="label">M:</span><span class="value" id="statM">8</span></div>
  <div class="stat"><span class="label">Dists (HNSW):</span><span class="value yellow" id="statHNSWDist">0</span></div>
  <div class="stat"><span class="label">Dists (Brute):</span><span class="value red" id="statBruteDist">0</span></div>
  <div class="stat"><span class="label">Recall@10:</span>
    <span class="recall-badge" id="recallBadge">—</span></div>
  <div class="mode-indicator search" id="modeIndicator">Click canvas to search</div>
</div>

<div class="main-area">
  <div class="sidebar">
    <div><h3>Parameters</h3>
      <div class="info-box">
        <div class="row"><span class="k">M (max connections)</span><span class="v" id="infoM">8</span></div>
        <div class="row"><span class="k">mL = 1/ln(M)</span><span class="v" id="infoMl">—</span></div>
        <div class="row"><span class="k">efConstruction</span><span class="v" id="infoEfC">64</span></div>
        <div class="row"><span class="k">efSearch</span><span class="v" id="infoEfS">40</span></div>
        <div class="row"><span class="k">k (neighbors)</span><span class="v">10</span></div>
      </div>
    </div>
    <div><h3>Legend</h3>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#6c8cff"></span> Normal</div>
        <div class="legend-item"><span class="legend-dot" style="background:#f0e040"></span> Entry</div>
        <div class="legend-item"><span class="legend-dot" style="background:#c084fc"></span> Path</div>
        <div class="legend-item"><span class="legend-dot" style="background:#ff8c4c"></span> Visited</div>
        <div class="legend-item"><span class="legend-dot" style="background:#4cdb6c"></span> Found NN</div>
        <div class="legend-item"><span class="legend-dot" style="background:#ff6c6c"></span> Missed NN</div>
        <div class="legend-item"><span class="legend-dot" style="background:#fff"></span> Query</div>
      </div>
    </div>
    <div><h3>Last Query</h3>
      <div class="query-results" id="queryResults">
        <div style="color:var(--muted);font-style:italic">No query yet</div>
      </div>
    </div>
  </div>
  <div class="canvas-area">
    <div class="layer-tabs" id="layerTabs"></div>
    <div class="canvas-wrap"><canvas id="mainCanvas"></canvas></div>
  </div>
</div>

<script>
// ======================== HNSW Graph ========================

class HNSW {
  constructor(M = 8, efConstruction = 64, efSearch = 40) {
    this.M = M;
    this.efConstruction = efConstruction;
    this.efSearch = efSearch;
    this.nodes = []; // {id, coords:[x,y], layer, conn:Set}
    this.entryPoint = 0;
    this.maxLayer = 0;
    this.distCalls = 0;
  }

  _logM() { return 1.0 / Math.log(this.M); }

  _randomLevel() {
    const mL = this._logM();
    return Math.floor(-Math.random() * mL);
  }

  _dist(a, b) {
    this.distCalls++;
    const dx = a[0] - b[0], dy = a[1] - b[1];
    return Math.sqrt(dx * dx + dy * dy);
  }

  // Greedy search from startNode down to targetLayer, returning nearest node id
  _greedyToLayer(query, startNode, targetLayer) {
    let best = startNode;
    let bestDist = this._dist(this.nodes[startNode].coords, query);

    const visited = new Set();
    const queue = [startNode];
    visited.add(startNode);

    while (queue.length > 0) {
      const cur = queue.shift();
      const node = this.nodes[cur];
      if (node.layer < targetLayer) continue;

      const d = this._dist(node.coords, query);
      if (d < bestDist) { bestDist = d; best = cur; }

      if (node.conn) {
        for (const nb of node.conn) {
          if (!visited.has(nb) && this.nodes[nb].layer >= targetLayer) {
            visited.add(nb);
            queue.push(nb);
          }
        }
      }
    }
    return best;
  }

  // Find efConstruction nearest neighbors at a given layer for a point
  _searchLayerAt(query, entryId, layer, ef) {
    // We need to find neighbors of the new point at this specific layer.
    // The candidates are existing nodes at this layer.
    const candidates = this.nodes.filter(n => n.layer === layer && n.id !== entryId);
    // Sort by distance to query
    candidates.sort((a, b) => this._dist(a.coords, query) - this._dist(b.coords, query));
    return candidates.slice(0, Math.min(ef, candidates.length)).map(n => n.id);
  }

  // Select a subset of candidates for connection, trying to keep them spread out
  _selectNeighbors(candidates, newNode, maxConn) {
    if (candidates.length <= maxConn) return candidates;

    // Simple approach: pick nearest first, then add ones that are far from each other
    const selected = [candidates[0]];
    for (let i = 1; i < candidates.length && selected.length < maxConn; i++) {
      const candDist = this._dist(this.nodes[candidates[i]].coords, this.nodes[newNode].coords);
      let dominated = false;
      for (const sel of selected) {
        const selDist = this._dist(this.nodes[candidates[i]].coords, this.nodes[sel].coords);
        // If candidate is much closer to newNode than selected neighbor, add it
        // This is a simplified version of the paper's heuristic
        if (candDist < selDist * 0.8) { dominated = true; break; }
      }
      if (!dominated) selected.push(candidates[i]);
    }
    return selected;
  }

  // Main insertion method matching the paper
  addPoint(coords) {
    const id = this.nodes.length;
    const layer = this._randomLevel();
    this.maxLayer = Math.max(this.maxLayer, layer);

    const newNode = { id, coords: [...coords], layer, conn: new Set() };
    this.nodes.push(newNode);

    if (this.nodes.length === 1) {
      this.entryPoint = id;
      return id;
    }

    // Determine connection count for this layer
    const newConnMax = layer === 0 ? this.M * 2 : this.M;

    // Find the entry point at the layer above (or the current entry point)
    let curEntry = this.entryPoint;

    // Navigate down from the top layer to the node's layer
    for (let l = this.maxLayer; l > layer; l--) {
      curEntry = this._greedyToLayer(coords, curEntry, l);
    }

    // Now search and connect at each layer from layer down to 0
    for (let l = layer; l >= 0; l--) {
      const connMax = l === 0 ? this.M * 2 : this.M;

      // Find candidate neighbors at this layer
      const candidateIds = this._searchLayerAt(coords, curEntry, l, this.efConstruction);

      if (candidateIds.length === 0) continue;

      // Select best neighbors for the new node
      const newNeighbors = this._selectNeighbors(candidateIds, id, connMax);

      // Also update: for each new neighbor, select the new node and other neighbors
      // that are mutually nearest (bidirectional, per paper)
      const bidirectional = new Set(newNeighbors);

      for (const nbId of newNeighbors) {
        const nbNode = this.nodes[nbId];
        // The new node should be among nbNode's nearest neighbors at this layer
        // nbNode's current connections at this layer
        const existingConn = [];
        if (nbNode.conn) {
          for (const cId of nbNode.conn) {
            if (this.nodes[cId].layer >= l) existingConn.push(cId);
          }
        }
        // Combine with new node
        const all = [...new Set([...existingConn, id])];
        all.sort((a, b) => this._dist(nbNode.coords, this.nodes[a].coords)
          - this._dist(nbNode.coords, this.nodes[b].coords));

        // Truncate to connMax
        const trimmed = all.slice(0, connMax);
        nbNode.conn = new Set(trimmed);

        // Also ensure bidirectionality: add nbId to new node's connections
        if (trimmed.includes(id)) {
          bidirectional.add(nbId);
        }
      }

      // Set connections for new node at this layer
      for (const nbId of bidirectional) {
        newNode.conn.add(nbId);
      }

      curEntry = newNeighbors[0]; // nearest neighbor becomes entry at this layer
    }

    // New point is the entry for future insertions
    this.entryPoint = id;
    return id;
  }

  // Search with animation trail
  search(query, k = 10, ef = 40) {
    this.distCalls = 0;
    const trail = []; // For animation: {id, layer, stage}
    const visited = new Set();
    const finalSet = new Set();

    if (this.nodes.length === 0) return { neighbors: [], trail, visited: [], entry: null };

    // Greedy descent from entry through layers
    let current = this.entryPoint;
    trail.push({ id: current, layer: this.nodes[current].layer, stage: 'entry' });
    visited.add(current);

    // Traverse from top layer down to layer 0
    for (let l = this.maxLayer; l >= 0; l--) {
      let improved = true;
      while (improved) {
        improved = false;
        const node = this.nodes[current];

        if (node.conn) {
          for (const nb of node.conn) {
            const nbNode = this.nodes[nb];
            if (nbNode.layer >= l && nb !== current) {
              if (!visited.has(nb)) visited.add(nb);
              const d = this._dist(nbNode.coords, query);
              trail.push({ id: nb, layer: l, stage: 'visit', dist: d });

              if (d < this._dist(node.coords, query)) {
                current = nb;
                improved = true;
              }
            }
          }
        }
      }
      trail.push({ id: current, layer: l, stage: 'atLayer' });
    }

    // At layer 0, widen search with ef
    const cands = new Map(); // id -> dist
    cands.set(current, this._dist(this.nodes[current].coords, query));
    visited.add(current);

    const inHeap = new Set([current]);
    const heap = new MaxHeap();
    heap.push({ id: current, dist: cands.get(current) });

    const frontier = [current];
    while (frontier.length > 0) {
      const nextFrontier = [];
      for (const fid of frontier) {
        const fNode = this.nodes[fid];
        if (fNode.conn) {
          for (const nb of fNode.conn) {
            if (!cands.has(nb)) {
              cands.set(nb, this._dist(this.nodes[nb].coords, query));
              visited.add(nb);
              trail.push({ id: nb, layer: 0, stage: 'efVisit', dist: cands.get(nb) });
              heap.push({ id: nb, dist: cands.get(nb) });
              if (heap.size > ef) heap.pop(); // remove largest
              nextFrontier.push(nb);
            }
          }
        }
      }
      frontier.length = 0;
      frontier.push(...nextFrontier);
    }

    // Top-k from candidates
    const sorted = [...cands.entries()].sort((a, b) => a[1] - b[1]);
    const topK = sorted.slice(0, k);

    for (const [nid] of topK) finalSet.add(nid);

    const neighbors = topK.map(([id, dist]) => ({
      id, dist, coords: [...this.nodes[id].coords]
    }));

    return { neighbors, trail, visited: [...visited], entry: this.entryPoint, finalSet: [...finalSet] };
  }

  // Brute-force k nearest
  bruteForce(query, k) {
    const dists = this.nodes.map(n => ({
      id: n.id,
      dist: this._dist(n.coords, query),
      coords: [...n.coords]
    }));
    dists.sort((a, b) => a.dist - b.dist);
    return { neighbors: dists.slice(0, k), totalDists: this.distCalls };
  }

  // Rebuild graph with new M
  rebuild(M) {
    this.M = M;
    const pts = this.nodes.map(n => ({ coords: [...n.coords] }));
    this.nodes = [];
    this.entryPoint = 0;
    this.maxLayer = 0;
    this.distCalls = 0;
    for (const p of pts) this.addPoint(p.coords);
  }

  // Insert count new points
  insert(count, range = 2) {
    for (let i = 0; i < count; i++) {
      this.addPoint([
        (Math.random() - 0.5) * range,
        (Math.random() - 0.5) * range
      ]);
    }
  }
}

// ======================== Heaps ========================

class MaxHeap {
  constructor() { this.h = []; }
  get size() { return this.h.length; }
  push(item) {
    this.h.push(item);
    let i = this.h.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (this.h[i].dist > this.h[p].dist) {
        [this.h[i], this.h[p]] = [this.h[p], this.h[i]];
        i = p;
      } else break;
    }
  }
  pop() {
    if (!this.h.length) return null;
    const top = this.h[0];
    const last = this.h.pop();
    if (this.h.length) {
      this.h[0] = last;
      let i = 0, n = this.h.length;
      while (true) {
        let lg = i, l = 2 * i + 1, r = 2 * i + 2;
        if (l < n && this.h[l].dist > this.h[lg].dist) lg = l;
        if (r < n && this.h[r].dist > this.h[lg].dist) lg = r;
        if (lg !== i) { [this.h[i], this.h[lg]] = [this.h[lg], this.h[i]]; i = lg; }
        else break;
      }
    }
    return top;
  }
}

// ======================== Renderer ========================

const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

let graph = new HNSW(8, 64, 40);
let activeTab = 'all'; // 'all' or number
let animState = null;
let animFrame = null;

function resize() {
  const wrap = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = wrap.clientWidth * dpr;
  canvas.height = wrap.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function canvasSize() {
  return { w: canvas.parentElement.clientWidth, h: canvas.parentElement.clientHeight };
}

function dataRange() {
  if (!graph.nodes.length) return { mn: -1, mx: 1, yn: -1, yx: 1 };
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const n of graph.nodes) {
    if (n.coords[0] < x0) x0 = n.coords[0];
    if (n.coords[0] > x1) x1 = n.coords[0];
    if (n.coords[1] < y0) y0 = n.coords[1];
    if (n.coords[1] > y1) y1 = n.coords[1];
  }
  const dx = (x1 - x0) * 0.12 || 1, dy = (y1 - y0) * 0.12 || 1;
  return { mn: x0 - dx, mx: x1 + dx, yn: y0 - dy, yx: y1 + dy };
}

function toC(x, y) {
  const s = canvasSize(), r = dataRange();
  const pw = s.w - 80, ph = s.h - 80;
  return [80 + ((x - r.mn) / (r.mx - r.mn)) * pw, 80 + (1 - (y - r.yn) / (r.yx - r.yn)) * ph];
}

function toD(cx, cy) {
  const s = canvasSize(), r = dataRange();
  const pw = s.w - 80, ph = s.h - 80;
  return [r.mn + ((cx - 80) / pw) * (r.mx - r.mn), r.yn + (1 - (cy - 80) / ph) * (r.yx - r.yn)];
}

const LAYER_CLR = [
  '#6c8cff','#ff6c6c','#4cdb6c','#ffd84c','#c084fc',
  '#ff8c4c','#4cd0ff','#ff4cd0','#84ff4c','#ff4c84',
  '#4c84ff','#c0c0c0','#808080','#404040','#ffcccc'
];

function draw() {
  const s = canvasSize(), r = dataRange();
  const N = graph.nodes.length;
  const radius = N > 500 ? 1.8 : N > 200 ? 2.5 : N > 80 ? 3.5 : 5;
  const pad = 2;

  ctx.fillStyle = '#0f1117';
  ctx.fillRect(0, 0, s.w, s.h);

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.035)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 6; i++) {
    const bx = 80 + (i / 6) * (s.w - 160), by = 80 + (i / 6) * (s.h - 160);
    ctx.beginPath(); ctx.moveTo(bx, 80); ctx.lineTo(bx, s.h - 80); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(80, by); ctx.lineTo(s.w - 80, by); ctx.stroke();
  }

  // Axis labels
  ctx.fillStyle = '#555'; ctx.font = '10px system-ui'; ctx.textAlign = 'center';
  for (let i = 0; i <= 6; i++) {
    const v = r.mn + (i / 6) * (r.mx - r.mn);
    ctx.fillText(v.toFixed(1), 80 + (i / 6) * (s.w - 160), s.h - 62);
  }
  ctx.textAlign = 'right';
  for (let i = 0; i <= 6; i++) {
    const v = r.yn + (1 - i / 6) * (r.yx - r.yn);
    ctx.fillText(v.toFixed(1), 68, 84 + (i / 6) * (s.h - 160));
  }

  // Filter nodes
  let nodes = graph.nodes;
  if (activeTab !== 'all') {
    const l = activeTab === 'above' ? 0 : +activeTab;
    if (activeTab === 'above') nodes = graph.nodes.filter(n => n.layer >= l);
    else nodes = graph.nodes.filter(n => n.layer === l);
  }
  const activeIds = new Set(nodes.map(n => n.id));

  // Edges
  ctx.lineWidth = 0.6;
  for (const node of nodes) {
    if (!node.conn) continue;
    for (const nb of node.conn) {
      if (nb <= node.id || !activeIds.has(nb)) continue;
      const [x1, y1] = toC(...node.coords);
      const [x2, y2] = toC(...graph.nodes[nb].coords);
      const alpha = activeTab === 'all' ? 0.08 : 0.35;
      ctx.strokeStyle = `rgba(120,140,200,${alpha})`;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }

  // Nodes
  for (const node of nodes) {
    const [cx, cy] = toC(...node.coords);
    let fill = LAYER_CLR[node.layer % LAYER_CLR.length];
    let st = null, rad = radius, glow = 0;

    if (animState) {
      if (node.id === animState.entryId) {
        fill = '#f0e040'; rad = radius * 2; glow = 10;
      } else if (animState.pathIds && animState.pathIds.has(node.id)) {
        fill = '#c084fc'; rad = radius * 1.4; glow = 5;
      } else if (animState.foundIds && animState.foundIds.has(node.id)) {
        fill = '#4cdb6c'; st = '#fff'; rad = radius * 1.6; glow = 6;
      } else if (animState.visitedIds && animState.visitedIds.has(node.id)) {
        fill = '#ff8c4c';
      } else if (animState.missedIds && animState.missedIds.has(node.id)) {
        fill = '#ff6c6c'; rad = radius * 1.6; st = '#fff';
      }
    }

    // Glow
    if (glow > 0) {
      ctx.beginPath(); ctx.arc(cx, cy, rad + glow, 0, Math.PI * 2);
      ctx.fillStyle = fill + '25'; ctx.fill();
    }

    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
    if (st) { ctx.strokeStyle = st; ctx.lineWidth = 1.5; ctx.stroke(); }

    if (radius > 3.5) {
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.font = `${Math.max(7, radius - 1)}px system-ui`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(node.id, cx, cy);
    }
  }

  // Query marker
  if (animState && animState.q) {
    const [qx, qy] = toC(...animState.q);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(qx - 10, qy); ctx.lineTo(qx + 10, qy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(qx, qy - 10); ctx.lineTo(qx, qy + 10); ctx.stroke();
    ctx.beginPath(); ctx.arc(qx, qy, 10, 0, Math.PI * 2); ctx.stroke();
  }

  // Title
  let title = 'All Layers';
  if (activeTab === 'above') title = `Layers ≥ ${activeTab} (${nodes.length} nodes)`;
  else if (activeTab !== 'all') title = `Layer ${activeTab} (${nodes.length} nodes)`;
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '12px system-ui'; ctx.textAlign = 'left';
  ctx.fillText(title, 82, 16);
}

// ======================== Layer Tabs ========================

function renderTabs() {
  const el = document.getElementById('layerTabs');
  let html = `<div class="layer-tab ${activeTab === 'all' ? 'active' : ''}" data-tab="all">All (${graph.nodes.length})</div>`;
  for (let l = graph.maxLayer; l >= 0; l--) {
    const cnt = graph.nodes.filter(n => n.layer === l).length;
    html += `<div class="layer-tab ${activeTab == l ? 'active' : ''}" data-tab="${l}">L${l} (${cnt})</div>`;
  }
  html += `<div class="layer-tab ${activeTab === 'above' ? 'active' : ''}" data-tab="above">≥L0 (${graph.nodes.length})</div>`;
  el.innerHTML = html;
  el.querySelectorAll('.layer-tab').forEach(t => {
    t.addEventListener('click', () => {
      activeTab = t.dataset.tab;
      renderTabs(); draw();
    });
  });
}

// ======================== Search Animation ========================

function runSearch(px, py) {
  const q = toD(px, py);
  const res = graph.search(q, 10, graph.efSearch);
  const bf = graph.bruteForce(q, 10);

  const foundIds = new Set(res.neighbors.map(n => n.id));
  const trueIds = new Set(bf.neighbors.map(n => n.id));
  const missedIds = new Set([...trueIds].filter(id => !foundIds.has(id)));
  const correctCount = [...foundIds].filter(id => trueIds.has(id)).length;
  const recall = trueIds.size > 0 ? correctCount / trueIds.size : 1;

  // Trail state for animation
  const pathSet = new Set();
  let trailIdx = 0;
  const totalTrailSteps = res.trail.length;
  const speed = parseInt(document.getElementById('speedSlider').value);

  animState = {
    q, entryId: res.entry,
    visitedIds: new Set(res.visited),
    foundIds,
    pathIds: pathSet,
    missedIds,
    recall,
    hnswDists: graph.distCalls,
    bfDists: bf.totalDists,
    found: res.neighbors,
    trueNbrs: bf.neighbors,
    step() {
      const perFrame = Math.max(1, Math.floor(speed / 5));
      for (let i = 0; i < perFrame && trailIdx < totalTrailSteps; i++) {
        pathSet.add(res.trail[trailIdx].id);
        trailIdx++;
      }
      if (trailIdx >= totalTrailSteps) {
        pathSet.clear(); // Remove path, keep visited/final
        return false;
      }
      return true;
    }
  };

  // Update UI
  updateRecall(recall);
  updateQueryPanel(animState);
  updateStats();

  // Animate
  if (animFrame) cancelAnimationFrame(animFrame);
  animStep();
}

function animStep() {
  if (!animState) return;
  const more = animState.step();
  draw();
  if (more) animFrame = requestAnimationFrame(animStep);
  else animState = null;
}

// ======================== UI Updates ========================

function updateRecall(recall) {
  const badge = document.getElementById('recallBadge');
  badge.textContent = (recall * 100).toFixed(1) + '%';
  badge.className = 'recall-badge ' + (recall >= 1.0 ? 'perfect' : 'imperfect');
}

function updateQueryPanel(as) {
  const el = document.getElementById('queryResults');
  let h = '';
  h += '<div style="color:var(--green);font-weight:600;margin:4px 0">True Nearest Neighbors:</div>';
  for (const n of as.trueNbrs) {
    const missed = as.missedIds.has(n.id);
    h += `<div class="item ${missed ? 'missed' : ''}"><span>#${n.id}</span><span>${n.dist.toFixed(4)}</span>${missed ? '<span style="color:var(--accent2)">✗</span>' : ''}</div>`;
  }
  h += '<div style="color:var(--accent);font-weight:600;margin:6px 0 3px">HNSW Found:</div>';
  for (const n of as.found) {
    h += `<div class="item"><span>#${n.id}</span><span>${n.dist.toFixed(4)}</span></div>`;
  }
  const speedup = as.bfDists > 0 ? (as.bfDists / as.hnswDists).toFixed(1) : '∞';
  h += `<div style="color:var(--muted);margin-top:6px;font-size:.85em">Dists: HNSW=${as.hnswDists}, Brute=${as.bfDists} | Speedup: ${speedup}×</div>`;
  el.innerHTML = h;
}

function updateStats() {
  document.getElementById('statPoints').textContent = graph.nodes.length;
  document.getElementById('statLayers').textContent = graph.maxLayer + 1;
  document.getElementById('statM').textContent = graph.M;
  document.getElementById('statHNSWDist').textContent = graph.distCalls;
  document.getElementById('statBruteDist').textContent = animState ? animState.bfDists : '—';
  document.getElementById('infoM').textContent = graph.M;
  document.getElementById('infoMl').textContent = (1 / Math.log(graph.M)).toFixed(4);
  document.getElementById('infoEfC').textContent = graph.efConstruction;
  document.getElementById('infoEfS').textContent = graph.efSearch;
}

// ======================== Events ========================

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  runSearch(e.clientX - rect.left, e.clientY - rect.top);
});

document.getElementById('efSlider').addEventListener('input', e => {
  graph.efSearch = +e.target.value;
  document.getElementById('efVal').textContent = e.target.value;
  document.getElementById('infoEfS').textContent = e.target.value;
});

document.getElementById('btnInsert100').addEventListener('click', () => {
  graph.insert(100);
  renderTabs(); updateStats(); draw();
});

document.getElementById('btnRebuild4').addEventListener('click', () => { graph.rebuild(4); renderTabs(); updateStats(); draw(); });
document.getElementById('btnRebuild8').addEventListener('click', () => { graph.rebuild(8); renderTabs(); updateStats(); draw(); });
document.getElementById('btnRebuild16').addEventListener('click', () => { graph.rebuild(16); renderTabs(); updateStats(); draw(); });

window.addEventListener('resize', resize);

// ======================== Init ========================
graph.insert(300);
renderTabs();
updateStats();
resize();
</script>
