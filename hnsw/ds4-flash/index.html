<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HNSW Interactive Visualization</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
  background: #1a1a2e; color: #e0e0e0; overflow-x: hidden;
  min-height: 100vh; display: flex; justify-content: center;
}
#app {
  max-width: 960px; width: 100%; padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.header h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.3px; color: #fff; }
.stats-bar {
  display: flex; gap: 20px; font-size: 13px; color: #aaa;
  background: #16213e; border-radius: 8px; padding: 8px 16px; align-items: center;
}
.stats-bar .label { color: #888; }
.stats-bar .val { color: #4fc3f7; font-weight: 600; }
.controls {
  display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  background: #16213e; border-radius: 8px; padding: 10px 16px; font-size: 13px;
}
.controls label { display: flex; align-items: center; gap: 6px; color: #ccc; }
.controls input[type=range] { width: 80px; accent-color: #4fc3f7; }
.controls select {
  background: #0f3460; color: #e0e0e0; border: 1px solid #333; border-radius: 4px;
  padding: 3px 6px; font-size: 13px;
}
.btn {
  background: #0f3460; color: #e0e0e0; border: 1px solid #2a2a4a;
  border-radius: 5px; padding: 5px 14px; cursor: pointer; font-size: 13px;
  transition: background 0.15s;
}
.btn:hover { background: #1a4a8a; }
.btn-primary { background: #1a6b3c; border-color: #2a8a4a; }
.btn-primary:hover { background: #20904a; }
.btn-warn { background: #8a4a1a; border-color: #aa5a2a; }
.btn-warn:hover { background: #a05a20; }
.results-bar {
  display: flex; gap: 24px; font-size: 14px; align-items: center;
  background: #16213e; border-radius: 8px; padding: 8px 16px; min-height: 36px;
}
.results-bar .label { color: #888; }
.results-bar .val { font-weight: 600; }
.recall-excellent { color: #66bb6a; }
.recall-good { color: #ffa726; }
.recall-poor { color: #ef5350; }
.tabs {
  display: flex; gap: 2px; flex-wrap: wrap;
}
.tab {
  background: #16213e; color: #888; border: 1px solid #2a2a4a;
  border-bottom: none; border-radius: 6px 6px 0 0; padding: 6px 16px;
  cursor: pointer; font-size: 13px; transition: all 0.15s;
}
.tab:hover { color: #ccc; background: #1c2a50; }
.tab.active { color: #4fc3f7; background: #0f3460; border-color: #4fc3f7; font-weight: 600; }
.canvas-wrapper {
  background: #0a0a1a; border-radius: 8px; border: 1px solid #2a2a4a;
  position: relative; overflow: hidden;
}
canvas { display: block; width: 100%; height: auto; cursor: crosshair; touch-action: none; }
#status {
  font-size: 13px; color: #aaa; text-align: center; padding: 4px; min-height: 24px;
}
.legend {
  display: flex; gap: 16px; font-size: 11px; color: #aaa;
  background: #16213e; border-radius: 6px; padding: 6px 12px; flex-wrap: wrap; align-items: center;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.missed-badge {
  display: inline-block; background: #ef5350; color: #fff; border-radius: 3px;
  padding: 1px 6px; font-size: 11px; font-weight: 600; margin-left: 4px;
}
@media (max-width: 600px) {
  .controls { flex-direction: column; align-items: stretch; }
  .controls label { justify-content: space-between; }
  .stats-bar { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>⚡ HNSW Graph</h1>
    <div style="flex:1"></div>
  </div>
  <div class="stats-bar">
    <span><span class="label">Points</span> <span class="val" id="pointCount">0</span></span>
    <span><span class="label">Layers</span> <span class="val" id="layerCount">0</span></span>
    <span><span class="label">M</span> <span class="val" id="mDisplay">8</span></span>
    <span><span class="label">efConstruction</span> <span class="val" id="efcDisplay">64</span></span>
    <span><span class="label">mL</span> <span class="val" id="mlDisplay">0.481</span></span>
  </div>
  <div class="controls">
    <label>efSearch <input type="range" id="efSlider" min="1" max="200" value="64"><span id="efVal">64</span></label>
    <label>Delay <input type="range" id="speedSlider" min="0" max="20" value="8"><span id="speedVal">8</span>ms</label>
    <button class="btn btn-primary" id="insertBtn">+ Insert 100</button>
    <label>Rebuild M
      <select id="mSelect"><option value="4">4</option><option value="8" selected>8</option><option value="12">12</option><option value="16">16</option></select>
      <button class="btn btn-warn" id="rebuildBtn">Rebuild</button>
    </label>
    <button class="btn" id="randBtn" title="Generate new random points">🎲 Randomize</button>
  </div>
  <div class="results-bar" id="resultsBar">
    <span><span class="label">Recall@10</span> <span class="val" id="recallDisplay">—</span></span>
    <span><span class="label">Distance computations</span>
      <span class="val" id="distHnsw">—</span> <span style="color:#555">HNSW</span> /
      <span class="val" id="distBf">—</span> <span style="color:#555">Brute</span>
      <span style="color:#555;margin-left:6px">(ratio <span class="val" id="distRatio">—</span>)</span>
    </span>
    <span id="missedInfo" style="display:none"></span>
  </div>
  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#4fc3f7"></span> Node</span>
    <span class="legend-item"><span class="legend-dot" style="background:#ffd54f"></span> Entry point</span>
    <span class="legend-item"><span class="legend-dot" style="background:#ef5350"></span> Current</span>
    <span class="legend-item"><span class="legend-dot" style="background:#ff8a65;opacity:0.7"></span> Candidate</span>
    <span class="legend-item"><span class="legend-dot" style="background:#42a5f5;opacity:0.5"></span> Visited</span>
    <span class="legend-item"><span class="legend-dot" style="background:#66bb6a"></span> kNN result</span>
    <span class="legend-item"><span class="legend-dot" style="border:2px dashed #ef5350;background:none"></span> Missed true NN</span>
    <span class="legend-item" id="pathLegend" style="display:none"><span style="color:#ffd54f">—</span> Search path</span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="canvas-wrapper"><canvas id="canvas"></canvas></div>
  <div id="status">Click anywhere on the canvas to query k=10 nearest neighbors</div>
</div>
<script>
// ============================================================
//  UTILITY
// ============================================================
function euclid(a, b) {
  const dx = a[0] - b[0], dy = a[1] - b[1];
  return Math.sqrt(dx * dx + dy * dy);
}

// ============================================================
//  HNSW — full implementation from the original paper
//  (Malkov & Yashunin, 2016 — Algorithm 1, 2, 3 & heuristic)
// ============================================================
class HNSW {
  constructor(M, efConstruction) {
    this.M = M;
    this.Mmax = M;
    this.Mmax0 = 2 * M;
    this.efConstruction = efConstruction;
    this.mL = 1 / Math.log(M);
    this.nodes = [];          // {id, vec, level, neigh: {layer: [id]}}
    this.entryPoint = null;
    this.maxLevel = -1;
    this.distComp = 0;
  }

  _dist(a, b) {
    this.distComp++;
    return euclid(a, b);
  }

  _randomLevel() {
    // Exponential distribution: l = floor(-ln(U) / ln(M))
    // mL = 1/ln(M), so l = floor(-ln(U) * mL)
    return Math.floor(-Math.log(1 - Math.random()) * this.mL);
  }

  addPoint(vec) {
    const level = this._randomLevel();
    const id = this.nodes.length;
    const node = { id, vec, level, neigh: {} };
    for (let l = 0; l <= level; l++) node.neigh[l] = [];
    this.nodes.push(node);
    if (this.entryPoint !== null) {
      this._insert(node);
    } else {
      this.entryPoint = id;
      this.maxLevel = level;
    }
    return node;
  }

  // ---- Algorithm 1: INSERT ----
  _insert(qNode) {
    const qId = qNode.id, qVec = qNode.vec, qLev = qNode.level;
    let ep = this.entryPoint;

    // Phase 1: traverse from maxLevel down to qLev+1 (ef=1, no connections added)
    for (let lc = this.maxLevel; lc > qLev; lc--) {
      const res = this._searchLayer(qVec, ep, 1, lc, null);
      ep = res[0];
    }

    // Phase 2: insert at levels min(qLev, maxLevel) down to 0
    const topLv = Math.min(qLev, this.maxLevel);
    for (let lc = topLv; lc >= 0; lc--) {
      const W = this._searchLayer(qVec, ep, this.efConstruction, lc, null);
      const Mcur = lc === 0 ? this.Mmax0 : this.Mmax;
      const neighIds = this._selectNeighbors(qVec, W, Mcur, lc);

      for (const nId of neighIds) {
        this._addConn(qId, nId, lc);
        this._addConn(nId, qId, lc);
      }
      // shrink neighbours that exceeded max connections
      for (const nId of new Set(neighIds)) {
        const nb = this.nodes[nId];
        const conns = nb.neigh[lc] || [];
        const maxConn = lc === 0 ? this.Mmax0 : this.Mmax;
        if (conns.length > maxConn) {
          nb.neigh[lc] = this._selectNeighbors(nb.vec, conns, maxConn, lc);
        }
      }
      ep = W[0];
    }

    if (qLev > this.maxLevel) {
      this.entryPoint = qId;
      this.maxLevel = qLev;
    }
  }

  // ---- Algorithm 2: SEARCH-LAYER ----
  // Returns [closest_first_node_ids]. When recordSteps is provided
  // the steps array is populated for animation.
  _searchLayer(qVec, epId, ef, layer, recordSteps) {
    const steps = recordSteps || null;
    const visited = new Set([epId]);
    const dEp = this._dist(qVec, this.nodes[epId].vec);
    const cand = [{ id: epId, d: dEp }]; // min-heap by d
    const res  = [{ id: epId, d: dEp }]; // max-heap by d (farthest first)
    const entry = epId;

    while (cand.length > 0) {
      // pop closest
      cand.sort((a, b) => a.d - b.d);
      const c = cand.shift();

      res.sort((a, b) => a.d - b.d);
      if (c.d > res[res.length - 1].d) break;

      // record *before* expanding (shows the decision)
      if (steps) {
        steps.push({
          kind: 'expand', layer,
          visited: [...visited],
          candidates: cand.map(x => x.id),
          results: res.map(x => x.id),
          current: c.id,
          entry,
        });
      }

      const nbors = this.nodes[c.id].neigh[layer] || [];
      for (const nId of nbors) {
        if (visited.has(nId)) continue;
        visited.add(nId);
        const d = this._dist(qVec, this.nodes[nId].vec);

        // sort ascending so that farthest is at the end
        // farD = distance of the ef-th closest (the farthest we'd keep)
        res.sort((a, b) => a.d - b.d);
        const farD = res.length >= ef ? res[res.length - 1].d : Infinity;

        if (res.length < ef || d < farD) {
          cand.push({ id: nId, d });
          res.push({ id: nId, d });
          // keep only the ef closest — sort asc, pop farthest (last)
          if (res.length > ef) {
            res.sort((a, b) => a.d - b.d);
            res.pop();
          }
        }
      }
    }

    res.sort((a, b) => a.d - b.d);
    return res.map(x => x.id);
  }

  // ---- Algorithm 3: SELECT-NEIGHBORS (heuristic / diverse) ----
  _selectNeighbors(qVec, candIds, M, layer) {
    if (candIds.length <= M) return candIds.slice();

    const scored = candIds.map(id => ({ id, d: this._dist(qVec, this.nodes[id].vec) }));
    scored.sort((a, b) => a.d - b.d);

    const selected = [];
    for (const s of scored) {
      if (selected.length >= M) break;
      let diverse = true;
      for (const sId of selected) {
        const dToSel = this._dist(this.nodes[s.id].vec, this.nodes[sId].vec);
        if (dToSel < s.d) { diverse = false; break; }
      }
      if (diverse) selected.push(s.id);
    }
    // Fill with closest if heuristic left slots
    for (const s of scored) {
      if (selected.length >= M) break;
      if (!selected.includes(s.id)) selected.push(s.id);
    }
    return selected;
  }

  _addConn(from, to, layer) {
    const nb = this.nodes[from].neigh[layer];
    if (!nb.includes(to)) nb.push(to);
  }

  // ---- Full search (greedy descent + layer-0 search) ----
  search(qVec, ef, k) {
    this.distComp = 0;
    const allSteps = [];
    let ep = this.entryPoint;
    if (ep === null) return { results: [], steps: allSteps, hnswDist: 0 };

    // Step 0: show entry point at top layer
    allSteps.push({
      kind: 'init', layer: this.maxLevel,
      visited: [ep], candidates: [ep], results: [ep],
      current: ep, entry: ep,
    });

    // Phase A — greedy descent from maxLevel down to layer 1
    for (let lc = this.maxLevel; lc >= 1; lc--) {
      const found = this._searchLayer(qVec, ep, 1, lc, allSteps);
      const nearest = found[0];
      allSteps.push({
        kind: 'descend', fromLayer: lc, toLayer: lc - 1,
        layer: lc, visited: [], candidates: [], results: [nearest],
        current: nearest, entry: ep, closest: nearest,
      });
      ep = nearest;
      allSteps.push({
        kind: 'enter', layer: lc - 1,
        visited: [ep], candidates: [ep], results: [ep],
        current: ep, entry: ep,
      });
    }

    // Phase B — search at layer 0 with ef
    const found0 = this._searchLayer(qVec, ep, Math.max(ef, k), 0, allSteps);
    const topK = found0.slice(0, k);

    allSteps.push({
      kind: 'final', layer: 0,
      visited: found0.slice(0, ef), candidates: [], results: topK,
      current: topK[0], entry: ep,
    });

    return { results: topK, steps: allSteps, hnswDist: this.distComp };
  }

  bruteForceSearch(qVec, k) {
    const scored = this.nodes.map((n, i) => ({ id: i, d: euclid(qVec, n.vec) }));
    scored.sort((a, b) => a.d - b.d);
    return { results: scored.slice(0, k).map(x => x.id), comps: this.nodes.length };
  }
}

// ============================================================
//  APPLICATION STATE
// ============================================================
let hnsw = new HNSW(8, 64);
let points = [];
let currentLayer = -1;
let animTimer = null;
let animId = 0; // monotonic id to discard stale animation loops
let searchState = null;
let isAnimating = false;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 840, H = 640;
canvas.width = W; canvas.height = H;
const PAD = 48;
const RANGE = 1000;

// DOM refs
const $ = id => document.getElementById(id);
const tabsEl = $('tabs');
const pointCountEl = $('pointCount');
const layerCountEl = $('layerCount');
const mDisplayEl = $('mDisplay');
const efcDisplayEl = $('efcDisplay');
const mlDisplayEl = $('mlDisplay');
const efSlider = $('efSlider');
const efVal = $('efVal');
const speedSlider = $('speedSlider');
const speedVal = $('speedVal');
const recallDisplay = $('recallDisplay');
const distHnsw = $('distHnsw');
const distBf = $('distBf');
const distRatio = $('distRatio');
const missedInfo = $('missedInfo');
const statusEl = $('status');

// ---- COORD HELPERS ----
function toCanvas(vec) {
  return [
    PAD + (vec[0] / RANGE) * (W - 2 * PAD),
    PAD + (vec[1] / RANGE) * (H - 2 * PAD),
  ];
}
function toData(cx, cy) {
  return [
    ((cx - PAD) / (W - 2 * PAD)) * RANGE,
    ((cy - PAD) / (H - 2 * PAD)) * RANGE,
  ];
}

function generatePoints(n) {
  return Array.from({ length: n }, () => [Math.random() * RANGE, Math.random() * RANGE]);
}

function buildIndex(pts, M, ef) {
  hnsw = new HNSW(M, ef);
  for (const p of pts) hnsw.addPoint(p);
}

function rebuildAll() {
  points = generatePoints(300);
  const M = parseInt($('mSelect').value);
  buildIndex(points, M, 64);
  refreshUI();
}

// ---- TABS ----
function renderTabs() {
  tabsEl.innerHTML = '';
  const top = hnsw.maxLevel;
  for (let l = top; l >= 0; l--) {
    const t = document.createElement('div');
    t.className = 'tab' + (l === currentLayer ? ' active' : '');
    t.textContent = `Layer ${l}`;
    t.dataset.layer = l;
    t.addEventListener('click', () => showLayer(l));
    tabsEl.appendChild(t);
  }
  if (currentLayer > top || currentLayer < 0) currentLayer = top;
}

function showLayer(layer, animState) {
  currentLayer = layer;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', parseInt(t.dataset.layer) === layer));
  drawCanvas(layer, animState);
}

function refreshUI() {
  const n = hnsw.nodes.length;
  pointCountEl.textContent = n;
  layerCountEl.textContent = hnsw.maxLevel + 1;
  mDisplayEl.textContent = hnsw.M;
  efcDisplayEl.textContent = hnsw.efConstruction;
  mlDisplayEl.textContent = hnsw.mL.toFixed(3);
  renderTabs();
  showLayer(hnsw.maxLevel, null);
  statusEl.textContent = `${n} points, ${hnsw.maxLevel + 1} layers. Click canvas to query.`;
}

// ============================================================
//  CANVAS RENDERING
// ============================================================
function drawCanvas(layer, animState) {
  const nodes = hnsw.nodes;
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  // Grid dots
  ctx.fillStyle = '#1a1a3a';
  for (let x = 0; x <= RANGE; x += 100)
    for (let y = 0; y <= RANGE; y += 100) {
      const [cx, cy] = toCanvas([x, y]);
      ctx.beginPath(); ctx.arc(cx, cy, 1.5, 0, Math.PI * 2); ctx.fill();
    }

  // Visible nodes at this layer
  const vis = nodes.filter(n => n.level >= layer);

  // Edges (draw each once)
  ctx.strokeStyle = '#2a2a4a';
  ctx.lineWidth = 1;
  const drawn = new Set();
  for (const n of vis) {
    const conns = n.neigh[layer] || [];
    for (const tId of conns) {
      const key = Math.min(n.id, tId) + ':' + Math.max(n.id, tId);
      if (drawn.has(key)) continue;
      drawn.add(key);
      const tn = nodes[tId];
      if (!tn || tn.level < layer) continue;
      const [x1, y1] = toCanvas(n.vec);
      const [x2, y2] = toCanvas(tn.vec);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }

  // ---- Sets used for highlights ----
  let queryPt = null;
  let visitedSet = new Set();
  let candSet = new Set();
  let resSet = new Set();
  let currentId = null;
  let entryId = null;
  let missedIds = [];
  let isFinal = false;
  let showEntry = false;

  if (animState && animState.steps && animState.steps.length > 0) {
    const idx = Math.min(animState.stepIdx, animState.steps.length - 1);
    const step = animState.steps[idx];
    queryPt = animState.query;
    missedIds = animState.missed || [];
    isFinal = step.kind === 'final';

    if (step) {
      visitedSet = new Set(step.visited || []);
      candSet = new Set(step.candidates || []);
      resSet = new Set(step.results || []);
      currentId = step.current;
      entryId = step.entry;

      // Show entry gold ring when step has an entry
      if (step.entry !== undefined) showEntry = true;
      // Also show entry ring for init/enter steps
      if (step.kind === 'init' || step.kind === 'enter') showEntry = true;
    }
  }

  // ---- Draw base nodes (not highlighted) ----
  const highlighted = new Set();
  if (animState) {
    for (const id of visitedSet) highlighted.add(id);
    for (const id of candSet) highlighted.add(id);
    for (const id of resSet) highlighted.add(id);
    for (const id of missedIds) highlighted.add(id);
    if (currentId !== null) highlighted.add(currentId);
    if (entryId !== null) highlighted.add(entryId);
  }

  for (const n of vis) {
    if (highlighted.has(n.id)) continue;
    const [x, y] = toCanvas(n.vec);
    const a = 0.35 + 0.5 * (n.level + 1) / (Math.max(hnsw.maxLevel, 1) + 1);
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(79, 195, 247, ${a})`;
    ctx.fill();
  }

  // ---- Draw entry point (gold ring) — also in idle mode ----
  if (!animState && hnsw.entryPoint !== null && nodes[hnsw.entryPoint] && nodes[hnsw.entryPoint].level >= layer) {
    const [x, y] = toCanvas(nodes[hnsw.entryPoint].vec);
    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255, 213, 79, 0.12)'; ctx.fill();
  }
  if (showEntry && entryId !== null && nodes[entryId] && nodes[entryId].level >= layer) {
    const [x, y] = toCanvas(nodes[entryId].vec);
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = 'rgba(255, 213, 79, 0.2)'; ctx.fill();
    ctx.fillStyle = '#ffd54f'; ctx.font = '10px sans-serif';
    ctx.fillText('EP', x + 13, y + 4);
  }

  // ---- Draw visited nodes (blue fill) ----
  for (const id of visitedSet) {
    if (id === currentId) continue;
    const n = nodes[id];
    if (!n || n.level < layer) continue;
    const [x, y] = toCanvas(n.vec);
    ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(66, 165, 245, 0.3)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(66, 165, 245, 0.5)'; ctx.lineWidth = 1; ctx.stroke();
  }

  // ---- Draw candidates (orange ring) ----
  for (const id of candSet) {
    if (id === currentId) continue;
    if (!visitedSet.has(id)) continue; // candidates are a subset of visited
    const n = nodes[id];
    if (!n || n.level < layer) continue;
    const [x, y] = toCanvas(n.vec);
    ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 138, 101, 0.7)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255, 138, 101, 0.15)'; ctx.fill();
  }

  // ---- Draw results (green ring) — at final step ----
  if (isFinal) {
    for (const id of resSet) {
      const n = nodes[id];
      if (!n || n.level < layer) continue;
      const [x, y] = toCanvas(n.vec);
      ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(102, 187, 106, 0.4)'; ctx.fill();
      ctx.strokeStyle = '#66bb6a'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#66bb6a'; ctx.font = 'bold 10px sans-serif';
      ctx.fillText('#' + (animState.steps.slice(-1)[0]?.results?.indexOf(id) + 1 || ''), x + 12, y + 4);
    }
    // Draw missed true neighbours (red dashed)
    for (const mId of missedIds) {
      const n = nodes[mId];
      if (!n || n.level < layer) continue;
      const [x, y] = toCanvas(n.vec);
      ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2);
      ctx.strokeStyle = '#ef5350'; ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#ef5350'; ctx.font = 'bold 10px sans-serif';
      ctx.fillText('✗', x + 15, y + 4);
    }
  }

  // ---- Draw current node (red ring) ----
  if (currentId !== null && nodes[currentId] && nodes[currentId].level >= layer) {
    const [x, y] = toCanvas(nodes[currentId].vec);
    // Glow
    const grad = ctx.createRadialGradient(x, y, 2, x, y, 16);
    grad.addColorStop(0, 'rgba(239,83,80,0.5)');
    grad.addColorStop(1, 'rgba(239,83,80,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill();
    // Ring
    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2);
    ctx.strokeStyle = '#ef5350'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = 'rgba(239, 83, 80, 0.25)'; ctx.fill();
  }

  // ---- Draw query point (purple cross) ----
  if (queryPt) {
    const [qx, qy] = toCanvas(queryPt);
    ctx.beginPath();
    ctx.moveTo(qx - 8, qy); ctx.lineTo(qx + 8, qy);
    ctx.moveTo(qx, qy - 8); ctx.lineTo(qx, qy + 8);
    ctx.strokeStyle = '#ce93d8'; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(qx, qy, 10, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(206, 147, 216, 0.4)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#ce93d8'; ctx.font = 'bold 10px sans-serif';
    ctx.fillText('Q', qx + 12, qy + 4);
  }

  // ---- Layer label ----
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.font = 'bold 48px sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText('L' + layer, W - 16, H - 8);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

// ============================================================
//  SEARCH & ANIMATION
// ============================================================
function startSearch(qVec) {
  // Cancel any running animation
  if (animTimer) { clearTimeout(animTimer); animTimer = null; }
  isAnimating = false;
  animId++;

  const ef = parseInt(efSlider.value);
  const k = 10;

  // HNSW search
  const { results, steps, hnswDist } = hnsw.search(qVec, ef, k);
  // Brute force ground truth
  const bf = hnsw.bruteForceSearch(qVec, k);

  // Recall
  const resSet = new Set(results);
  let hits = 0;
  for (const id of bf.results) if (resSet.has(id)) hits++;
  const recall = hits / k;
  const missed = bf.results.filter(id => !resSet.has(id));

  searchState = {
    steps, query: qVec,
    recall, hnswDist, bfComps: bf.comps, missed,
    stepIdx: 0, finished: false,
  };

  updateResults(searchState);
  animateSearch(searchState, animId);
}

function animateSearch(state, id) {
  isAnimating = true;
  const baseDelay = Math.min(parseInt(speedSlider.value), 50);

  function tick() {
    if (id !== animId) return; // stale

    if (state.stepIdx >= state.steps.length) {
      isAnimating = false;
      const last = state.steps[state.steps.length - 1];
      if (last && last.layer !== undefined) showLayer(last.layer, state);
      else drawCanvas(currentLayer, state);
      statusEl.textContent = '✓ Search complete';
      return;
    }

    const s = state.steps[state.stepIdx];

    // Switch layer if needed
    if (s.layer !== undefined && s.layer !== currentLayer) {
      showLayer(s.layer, state);
    } else {
      drawCanvas(currentLayer, state);
    }

    // Status message
    switch (s.kind) {
      case 'init':
        statusEl.textContent = `❶ Entry point = node ${s.current} at top layer L${s.layer}`; break;
      case 'enter':
        statusEl.textContent = `❷ Entering L${s.layer} via node ${s.entry}`; break;
      case 'expand':
        statusEl.textContent = `❸ L${s.layer} · expand node ${s.current} · ${s.candidates.length} candidates · ${s.results.length} results`; break;
      case 'descend':
        statusEl.textContent = `❹ L${s.fromLayer} → L${s.toLayer} · closest = node ${s.closest}`; break;
      case 'final':
        statusEl.textContent = `❺ k=${s.results.length} nearest at L0 — computing recall…`; break;
    }

    state.stepIdx++;
    animTimer = setTimeout(tick, baseDelay);
  }

  tick();
}

function updateResults(state) {
  const p = (state.recall * 100).toFixed(1);
  recallDisplay.textContent = p + '%';
  recallDisplay.className = 'val ' + (
    state.recall >= 0.99 ? 'recall-excellent' :
    state.recall >= 0.90 ? 'recall-good' :
    'recall-poor');

  distHnsw.textContent = state.hnswDist;
  distBf.textContent = state.bfComps;
  const r = state.hnswDist > 0 ? (state.bfComps / state.hnswDist).toFixed(1) : '—';
  distRatio.textContent = r + '×';

  if (state.missed.length > 0) {
    missedInfo.style.display = 'inline';
    missedInfo.innerHTML = `<span class="missed-badge">${state.missed.length} missed</span> true NN: [${state.missed.slice(0,5).join(',')}${state.missed.length > 5 ? '…' : ''}]`;
  } else {
    missedInfo.style.display = 'none';
  }
}

// ---- CANVAS CLICK ----
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width;
  const sy = canvas.height / rect.height;
  const cx = (e.clientX - rect.left) * sx;
  const cy = (e.clientY - rect.top) * sy;
  startSearch(toData(cx, cy));
});

// ---- CONTROLS ----
efSlider.addEventListener('input', () => { efVal.textContent = efSlider.value; });
speedSlider.addEventListener('input', () => { speedVal.textContent = speedSlider.value; });

$('insertBtn').addEventListener('click', () => {
  if (isAnimating) return;
  const newPts = generatePoints(100);
  for (const p of newPts) hnsw.addPoint(p);
  points = points.concat(newPts);
  refreshUI();
  statusEl.textContent = `+100 points inserted (total ${hnsw.nodes.length})`;
});

$('rebuildBtn').addEventListener('click', () => {
  if (isAnimating) return;
  const M = parseInt($('mSelect').value);
  buildIndex(points, M, 64);
  refreshUI();
  statusEl.textContent = `Rebuilt with M=${M}`;
});

$('randBtn').addEventListener('click', () => {
  if (isAnimating) return;
  rebuildAll();
});

// ============================================================
//  INIT
// ============================================================
(function init() {
  points = generatePoints(300);
  buildIndex(points, 8, 64);
  refreshUI();
  statusEl.textContent = `Ready — ${hnsw.nodes.length} points, ${hnsw.maxLevel + 1} layers. Click to query.`;
})();
</script>
